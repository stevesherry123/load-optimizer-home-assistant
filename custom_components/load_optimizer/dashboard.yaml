title: Load Optimizer
views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt-outline
    cards:
      - type: entities
        title: Integration health
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_runtime_status
          - sensor.load_optimizer_status
          - sensor.load_optimizer_restart_safety
          - sensor.load_optimizer_diagnostics
      - type: tile
        entity: sensor.load_optimizer_1_current_energy_price
        name: Current import price
        icon: mdi:cash-clock
      - type: tile
        entity: sensor.load_optimizer_ofgem_price_cap_benchmark
        name: Ofgem default-tariff benchmark
        icon: mdi:chart-line-variant
      - type: entities
        title: Tariff outlook
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_1_tariff_horizon
          - sensor.load_optimizer_1_cost_status
          - sensor.load_optimizer_1_cheapest_start
          - sensor.load_optimizer_1_cheapest_cost
      - type: glance
        title: Appliance plans
        columns: 3
        entities:
          - entity: sensor.load_optimizer_1_schedule_status
            name: Appliance 1
          - entity: sensor.load_optimizer_2_schedule_status
            name: Appliance 2
          - entity: sensor.load_optimizer_3_schedule_status
            name: Appliance 3

  - title: Appliances
    path: appliances
    icon: mdi:dishwasher
    cards:
      - type: entities
        title: Appliance 1
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_1_status
          - sensor.load_optimizer_1_cycle_state
          - sensor.load_optimizer_1_program
          - sensor.load_optimizer_1_power
          - sensor.load_optimizer_1_total_runs
          - sensor.load_optimizer_1_learned_programs
          - sensor.load_optimizer_1_cost_status
          - sensor.load_optimizer_1_recommended_start
          - sensor.load_optimizer_1_estimated_scheduled_cost
          - sensor.load_optimizer_1_good_to_start
      - type: markdown
        title: Automatic Scheduling
        content: |-
          {% set explanation = 'sensor.load_optimizer_1_automation_explanation' %}
          {% set orchestration = 'sensor.load_optimizer_1_orchestration_status' %}
          {% set request = state_attr(orchestration, 'request') or {} %}
          {% set available = has_value(explanation) %}
          {% set summary = state_attr(explanation, 'summary') if available else none %}
          {% macro local_time(value) -%}
          {{ (as_datetime(value) | as_local).strftime('%a %d %b %H:%M %Z') if as_datetime(value, none) else 'None recorded' }}
          {%- endmacro %}
          {% if summary %}
          **{{ summary }}**
          {% elif request %}
          **{{ request.get('program', 'Programme') }} is queued for a start-time safety check.**
          {% elif states(orchestration) in ['unknown', 'unavailable'] %}
          **Scheduling status is unavailable.**
          {% else %}
          **No wash is queued. A recommendation alone is not a scheduled start.**
          {% endif %}

          {% set action = state_attr(explanation, 'action_required') if available else none %}
          {% if action %}{{ action }}{% endif %}

          **Automatic modes:** overnight {{ states('switch.load_optimizer_1_auto_mode_enabled') }}, free / negative price {{ states('switch.load_optimizer_1_auto_negative_price_enabled') }}.
          {% set rejected_at = as_timestamp(state_attr('sensor.load_optimizer_1_last_discarded_cycle', 'finish'), none) %}
          {% set completed_at = as_timestamp(state_attr(orchestration, 'last_cycle_completed_at'), none) %}
          {% set learned_at = as_timestamp(states('sensor.load_optimizer_1_last_finish'), none) %}
          {% if rejected_at is not none and completed_at is not none and (completed_at - rejected_at) | abs < 120 and (learned_at is none or learned_at < rejected_at) %}
          **Records need review:** The scheduler recorded completion for a rejected capture. It was not learned as a wash.
          {% endif %}

          {% set start = request.get('start') %}
          {% if start %}
          **Queued start:** {{ local_time(start) }}
          {% else %}
          **Recommendation (not queued):** {{ state_attr('sensor.load_optimizer_1_overnight_recommendation', 'program') or 'None' }},
          {{ local_time(state_attr('sensor.load_optimizer_1_overnight_recommendation', 'start')) }}
          {% endif %}

          | Record | Home time |
          |---|---|
          | Last automatic request | {{ local_time(state_attr(orchestration, 'last_auto_normal_request')) }} |
          | Last start attempt | {{ local_time(state_attr(orchestration, 'last_attempt')) }} |
          {% set eligible = state_attr(explanation, 'automatic_eligible_after') if available else none %}
          {% if eligible %}| Next automatic eligibility | {{ local_time(eligible) }} |{% endif %}

          {% set labels = {
            'automatic_window_already_used': 'This overnight window has already been reserved',
            'request_already_pending': 'A start request is already queued',
            'automatic_mode_off': 'Automatic mode is off',
            'door_not_opened_since_last_cycle': 'Door has not opened since the last wash',
            'door_currently_open': 'Door is currently open',
            'recommendation_not_ready': 'No fully priced eligible programme',
            'confidence_below_threshold': 'Learning confidence below the required level',
            'confidence_relaxed_for_cooldown_rotation': 'Lower confidence allowed during programme cooldown rotation',
            'optimizer_not_ready': 'Optimizer is not ready',
            'appliance_not_idle': 'A cycle capture is active',
            'connected': 'Appliance is disconnected',
            'remote_control': 'Remote control is disabled',
            'remote_start': 'Remote start is disabled'
          } %}
          {% for code in (((state_attr(explanation, 'blockers') or []) + (state_attr(explanation, 'warnings') or [])) if available else []) %}
          - {{ labels.get(code, code | replace('_', ' ')) }}
          {% endfor %}
          {% set confidence = state_attr(explanation, 'confidence') if available else none %}
          {% if confidence is not none %}**Learning confidence:** {{ confidence }}% (normal threshold {{ state_attr(explanation, 'confidence_threshold') }}%).{% endif %}


          **Last scheduler result:** {{ (state_attr(orchestration, 'last_result') or 'None recorded') | replace('_', ' ') }}.
          {{ (state_attr(orchestration, 'last_message') or '').split('; operation=')[0] }}

          {% set discarded = 'sensor.load_optimizer_1_last_discarded_cycle' %}
          {% if state_attr(discarded, 'finish') %}
          **Last ignored learning capture:** {{ local_time(state_attr(discarded, 'finish')) }},
          {{ state_attr(discarded, 'runtime_minutes') }} min.
          {{ (state_attr(discarded, 'exclusion_reason') or 'Not suitable for learning') | replace('_', ' ') }}.
          {% endif %}

          {% set events = (state_attr(explanation, 'recent_events') or []) if available else [] %}
          {% if events %}
          **Recent scheduling events**
          {% for item in events[:5] %}
          - {{ local_time(item.timestamp) }}: {{ item.event | replace('_', ' ') }}; {{ item.reason | replace('_', ' ') }}.
          {% endfor %}
          {% endif %}
      - type: entities
        title: Dishwasher scheduling
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_1_orchestration_status
          - sensor.load_optimizer_1_overnight_readiness
          - sensor.load_optimizer_1_negative_price_readiness
          - switch.load_optimizer_1_auto_mode_enabled
          - switch.load_optimizer_1_auto_negative_price_enabled
          - select.load_optimizer_1_override_program
          - entity: button.load_optimizer_1_request_now_override
            name: Start Selected Program Now
          - entity: button.load_optimizer_1_request_soon_override
            name: Schedule Selected Program Soon
          - entity: button.load_optimizer_1_request_overnight_override
            name: Schedule Selected Program Overnight
          - button.load_optimizer_1_request_now
          - button.load_optimizer_1_request_soon
          - button.load_optimizer_1_request_overnight
          - button.load_optimizer_1_cancel_schedule
          - button.load_optimizer_1_recalculate_now
      - type: entities
        title: Special price window
        show_header_toggle: false
        entities:
          - switch.load_optimizer_special_price_window_enabled
          - datetime.load_optimizer_special_price_window_start
          - datetime.load_optimizer_special_price_window_end
          - number.load_optimizer_special_price_window_price
          - text.load_optimizer_special_price_window_label
      - type: entities
        title: Appliance 2
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_2_status
          - sensor.load_optimizer_2_cycle_state
          - sensor.load_optimizer_2_power
          - sensor.load_optimizer_2_total_runs
          - sensor.load_optimizer_2_learned_programs
          - sensor.load_optimizer_2_cost_status
          - sensor.load_optimizer_2_recommended_start
          - sensor.load_optimizer_2_estimated_scheduled_cost
          - sensor.load_optimizer_2_good_to_start
      - type: entities
        title: Appliance 3
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_3_status
          - sensor.load_optimizer_3_cycle_state
          - sensor.load_optimizer_3_power
          - sensor.load_optimizer_3_total_runs
          - sensor.load_optimizer_3_learned_programs
          - sensor.load_optimizer_3_cost_status
          - sensor.load_optimizer_3_recommended_start
          - sensor.load_optimizer_3_estimated_scheduled_cost
          - sensor.load_optimizer_3_good_to_start
      - type: markdown
        title: Automation Capabilities
        content: |-
          {% set programs = state_attr('sensor.load_optimizer_1_program_capabilities', 'programs') or [] %}
          {% if programs %}
          | Program | Auto | Normal | Free / negative | Remote |
          |---|---:|---:|---:|---|
          {% for item in programs %}
          | {{ item.program }} | {{ 'yes' if item.can_auto_start else 'no' }} | {{ 'yes' if item.can_recommend else 'no' }} | {{ 'yes' if item.can_negative_price else 'no' }} | {{ item.remote_start_status | replace('_', ' ') }} |
          {% endfor %}
          {% else %}
          No automation-capability data has been published yet.
          {% endif %}

  - title: EV charging
    path: ev-charging
    icon: mdi:ev-station
    cards:
      - type: entities
        title: EV charging plan
        show_header_toggle: false
        entities:
          - sensor.volvo_xc60_optimizer
          - sensor.volvo_xc60_optimizer_2
          - sensor.volvo_xc60_optimizer_3
          - sensor.volvo_xc60_optimizer_4
          - sensor.volvo_xc60_optimizer_5
          - sensor.volvo_xc60_optimizer_6
          - binary_sensor.volvo_xc60_optimizer
          - binary_sensor.volvo_xc60_optimizer_2

  - title: Learning
    path: learning
    icon: mdi:chart-bell-curve-cumulative
    cards:
      - type: entities
        title: Appliance 1 learning
        show_header_toggle: false
        entities:
          - sensor.load_optimizer_1_last_program
          - sensor.load_optimizer_1_last_runtime
          - sensor.load_optimizer_1_last_energy
          - sensor.load_optimizer_1_last_finish
          - sensor.load_optimizer_1_program_model
          - sensor.load_optimizer_1_program_catalogue
          - sensor.load_optimizer_1_last_discarded_cycle
      - type: history-graph
        title: Appliance power
        hours_to_show: 24
        entities:
          - sensor.load_optimizer_1_power
          - sensor.load_optimizer_2_power
          - sensor.load_optimizer_3_power
