import_legacy_state:
  name: Import legacy state
  description: Import the existing add-on /data/load_optimizer.json database into integration storage.
  fields:
    legacy_state_json:
      name: Legacy state JSON
      description: Contents of the legacy add-on /data/load_optimizer.json file.
      required: true
      selector:
        text:
          multiline: true

mothball_legacy_addon:
  name: Mothball legacy add-on
  description: Publish guidance that the legacy add-on can be stopped after validating integration parity.

recover:
  name: Recover learned-appliance runtime
  description: Reloads learned-appliance Load Optimizer entries without depending on the retired add-on.

prepare_orchestration_migration:
  name: Prepare orchestration migration
  description: Capture legacy dishwasher helper and automation state without changing or disabling the live package.

activate_native_orchestration:
  name: Activate native orchestration
  description: Disable the captured package automations and give appliance command ownership to the integration.

deactivate_native_orchestration:
  name: Deactivate native orchestration
  description: Stop native command ownership and re-enable the captured package automations.
analyse_tariffs:
  name: Analyse tariffs
  description: Recalculate the selected entry's read-only tariff analysis.
  fields:
    entry_id:
      required: true
      selector:
        text:
export_tariff_history:
  name: Export tariff history
  description: Return complete historical days as portable JSON, separate from appliance learning.
  fields:
    entry_id:
      required: true
      selector:
        text:
    retention_days:
      default: 90
      selector:
        number:
          min: 1
          max: 365
import_tariff_history:
  name: Import tariff history
  description: Validate portable history with a dry run by default. Live history is protected unless explicitly overridden.
  fields:
    entry_id:
      required: true
      selector:
        text:
    history_json:
      required: true
      selector:
        text:
          multiline: true
    dry_run:
      default: true
      selector:
        boolean:
    overwrite_live:
      default: false
      selector:
        boolean:
    retention_days:
      default: 90
      selector:
        number:
          min: 1
          max: 365
generate_tariff_summary:
  name: Generate optional tariff summary
  description: Explicitly request a compact narrative from a selected Home Assistant AI Task entity. No automatic AI calls occur.
  fields:
    entry_id:
      required: true
      selector:
        text:
    ai_task_entity:
      required: true
      selector:
        entity:
          domain: ai_task
