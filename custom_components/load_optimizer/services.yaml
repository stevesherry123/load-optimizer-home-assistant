import_legacy_state:
  name: Import legacy state
  description: Administrator only. Import the existing add-on database (maximum 16 MiB). Finish captures and cancel pending requests first.
  fields:
    legacy_state_json:
      name: Legacy state JSON
      description: Contents of the legacy add-on /data/load_optimizer.json file.
      required: true
      selector:
        text:
          multiline: true

mothball_legacy_addon:
  name: Mothball legacy add-on
  description: Administrator only. Publish guidance that the legacy add-on can be stopped after validating integration parity.

recover:
  name: Recover learned-appliance runtime
  description: Administrator only. Reloads learned-appliance entries without the retired add-on. Wait for active cycle captures to finish first.

prepare_orchestration_migration:
  name: Prepare orchestration migration
  description: Administrator only. Capture legacy dishwasher helper and automation state without changing or disabling the live package.

activate_native_orchestration:
  name: Activate native orchestration
  description: Administrator only. Disable the captured package automations and give appliance command ownership to the integration.

deactivate_native_orchestration:
  name: Deactivate native orchestration
  description: Administrator only. Cancel pending native commands, stop native ownership and re-enable the captured package automations. An already running wash is not stopped.
