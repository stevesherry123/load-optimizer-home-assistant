name: Fix and publish v1.4.1 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-v1.4.1-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    if: github.repository == 'stevesherry123/load-optimizer-home-assistant' && github.event.head_commit.message == 'Publish v1.4.1 hotfix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Home Assistant 2026.10 registry fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "custom_components/load_optimizer/orchestration_entity.py",
              "custom_components/load_optimizer/sensor.py",
          ):
              path = Path(name)
              text = path.read_text()
              old = "(DOMAIN, entry.entry_id)\n        )"
              new = "(DOMAIN, entry.entry_id), entry.entry_id\n        )"
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected registry lookup in {name}")
              path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/test_app.py")
          test_text = test_path.read_text()
          anchor = '            self.assertIn("async_get_device_by_identifier", source)\n'
          assertion = '            self.assertIn("(DOMAIN, entry.entry_id), entry.entry_id", source)\n'
          if assertion not in test_text:
              if test_text.count(anchor) != 1:
                  raise SystemExit("Unexpected registry test anchor")
              test_path.write_text(test_text.replace(anchor, anchor + assertion, 1))

          manifest = Path("custom_components/load_optimizer/manifest.json")
          manifest_text = manifest.read_text()
          if manifest_text.count('"version": "1.4.0"') != 1:
              raise SystemExit("Unexpected manifest version")
          manifest.write_text(manifest_text.replace('"version": "1.4.0"', '"version": "1.4.1"', 1))

          runtime = Path("custom_components/load_optimizer/legacy/app_runtime.py")
          runtime_text = runtime.read_text()
          if runtime_text.count('APP_VERSION = "1.4.0"') != 1:
              raise SystemExit("Unexpected runtime version")
          runtime.write_text(runtime_text.replace('APP_VERSION = "1.4.0"', 'APP_VERSION = "1.4.1"', 1))

          changelog = Path("load_optimizer/CHANGELOG.md")
          changelog_text = changelog.read_text()
          marker = "# Changelog\n\n"
          entry = (
              "## 1.4.1\n\n"
              "- Fix Home Assistant 2026.10 device-registry lookup compatibility so "
              "native learned-appliance and orchestration entities register after restart.\n\n"
          )
          if "## 1.4.1" not in changelog_text:
              changelog.write_text(changelog_text.replace(marker, marker + entry, 1))
          PY

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit, publish, and remove the one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/load_optimizer/orchestration_entity.py \
            custom_components/load_optimizer/sensor.py \
            custom_components/load_optimizer/manifest.json \
            custom_components/load_optimizer/legacy/app_runtime.py \
            load_optimizer/CHANGELOG.md tests/test_app.py
          git commit -m "Fix device registry lookup for Home Assistant 2026.10"
          git push origin HEAD:main
          fixed_sha="$(git rev-parse HEAD)"
          gh release create v1.4.1 \
            --repo "${{ github.repository }}" \
            --target "$fixed_sha" \
            --title "Load Optimizer v1.4.1" \
            --notes "Fix Home Assistant 2026.10 device-registry compatibility so native learned-appliance and orchestration entities register correctly after restart."
          git rm .github/workflows/fix-v1.4.1-once.yml
          git commit -m "Remove v1.4.1 one-shot workflow"
          git push origin HEAD:main
