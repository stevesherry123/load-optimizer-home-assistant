name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security and credential scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scan integration Python
        run: |
          pip install "bandit==1.8.6"
          bandit -r custom_components/load_optimizer
      - name: Scan repository history for credentials
        run: |
          # Official Gitleaks v8.30.1 Linux amd64 image.
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --log-opts=--all /repo

  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install "PyYAML==6.0.2"
          python -m unittest discover -s tests

  minimum_ha:
    name: Minimum Home Assistant imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install declared minimum Home Assistant
        run: pip install -r dev/requirements-validation.txt
      - name: Check the validation environment
        run: python dev/validate.py --preflight
      - name: Run every isolated Home Assistant acceptance check
        run: python dev/validate.py --suite ha --output .local/ci-validation
      - name: Publish acceptance summary
        if: always()
        run: |
          if [ -f .local/ci-validation/summary.md ]; then
            cat .local/ci-validation/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Acceptance checks did not complete. Inspect the preceding environment/setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .local/ci-validation/results.json ]; then
            python -c "import json,pathlib; p=pathlib.Path('.local/ci-validation'); r=json.loads((p/'results.json').read_text()); [(print('FAILED: '+c['name']),print((p/c['log']).read_text()[-16000:])) for c in r['checks'] if not c['passed']]"
          fi

  current_ha:
    name: Pinned Home Assistant compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned compatibility environment
        run: pip install -r dev/requirements-validation-compatibility.txt
      - name: Run every isolated Home Assistant acceptance check
        run: python dev/validate.py --requirements dev/requirements-validation-compatibility.txt --suite ha --output .local/ci-validation
      - name: Publish acceptance summary
        if: always()
        run: |
          if [ -f .local/ci-validation/summary.md ]; then
            cat .local/ci-validation/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Acceptance checks did not complete. Inspect the preceding environment/setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .local/ci-validation/results.json ]; then
            python -c "import json,pathlib; p=pathlib.Path('.local/ci-validation'); r=json.loads((p/'results.json').read_text()); [(print('FAILED: '+c['name']),print((p/c['log']).read_text()[-16000:])) for c in r['checks'] if not c['passed']]"
          fi

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, reviewed 2026-10-09
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, reviewed 2026-10-09
