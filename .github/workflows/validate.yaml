name: Validate

on:
  push:
    branches:
      - main
      - "beta/**"
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security and credential scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scan integration Python
        run: |
          pip install "bandit==1.8.6"
          bandit -r custom_components/load_optimizer
      - name: Scan repository history for credentials
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .

  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install "PyYAML==6.0.2"
          python -m unittest discover -s tests

  minimum_ha:
    name: Minimum Home Assistant imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install declared minimum Home Assistant
        run: pip install "homeassistant==2026.10.2" "home-assistant-frontend==20260930.4" "pyotp==2.10.0" "PyQRCode==1.2.1"
      - name: Import all integration platforms and config flow
        run: python tests/ha_import_smoke.py
      - name: Verify Octopus version floor and renamed source ownership
        run: python tests/ha_calendar_config_smoke.py
      - name: Verify dashboard price colours with Home Assistant templates
        run: python tests/ha_dashboard_smoke.py
      - name: Verify real EV configuration, reload and restart persistence
        run: python tests/ha_ev_lifecycle_smoke.py
      - name: Verify guided EV review and append-only dashboard without hardware
        run: python tests/ha_ev_guided_setup_smoke.py
      - name: Verify opt-in EV switch control and ownership recovery with synthetic charger
        run: python tests/ha_ev_control_smoke.py
      - name: Verify passive charging-test alerts with synthetic switch and notifiers
        run: python tests/ha_ev_alerts_smoke.py
      - name: Test simulated battery feedback in Home Assistant
        run: python tests/ha_ev_battery_fill_smoke.py
      - name: Verify trial battery settings restore across separate Home Assistant processes
        run: python tests/ha_ev_trial_restore_smoke.py
      - name: Verify documented clean-install examples and safe control defaults
        run: python tests/ha_onboarding_smoke.py
      - name: Verify sensor-outage learning and automatic no-run source enforcement
        run: python tests/ha_runtime_safety_smoke.py
      - name: Verify free-price repeat planning, persistence and fresh safety vetoes
        run: python tests/ha_negative_price_smoke.py
      - name: Verify overnight late-publication replanning and manual request preservation
        run: python tests/ha_overnight_planning_smoke.py
      - name: Verify Power Up free-price preflight and Power Down precedence
        run: python tests/ha_power_up_smoke.py
      - name: Verify published forecast coverage, strict history and manual-only AI
        run: python tests/ha_forecast_coverage_smoke.py
      - name: Verify permissions, diagnostic privacy, safe imports and HTTP boundaries
        run: python tests/ha_security_smoke.py

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, reviewed 2026-10-09
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, reviewed 2026-10-09
