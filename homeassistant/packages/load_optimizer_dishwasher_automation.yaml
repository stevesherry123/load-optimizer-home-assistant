# Optional Home Assistant orchestration for Dishwasher 1, package version 0.8.59.
#
# Load Optimizer remains the recommendation engine. These helpers and
# automations let dashboards, voice assistants, and household automations request
# a run without duplicating scheduling logic.
#
# Before using this package, load it into Home Assistant, populate the Bosch
# helper values with your own appliance entities, and replace
# `script.load_optimizer_announce` with the equivalent from your own Home
# Assistant instance.
#
# The announcement script should speak or notify the current value of
# `input_text.announce_text`, or you can replace both announcement actions with
# your own notification service.

input_select:
  load_optimizer_1_requested_mode:
    name: Dishwasher 1 Requested Mode
    icon: mdi:dishwasher
    options:
      - none
      - now
      - soon
      - overnight
      - negative_price
      - automatic
    initial: none

  load_optimizer_1_override_program:
    name: Dishwasher 1 Override Program
    icon: mdi:format-list-bulleted
    options:
      - engine
      - PreRinse
      - Quick45
      - Quick65
      - QuickD
      - Eco50
      - Super60
      - MachineCare
    initial: engine

input_boolean:
  load_optimizer_1_auto_mode_enabled:
    name: Dishwasher 1 Automatic Overnight Mode
    icon: mdi:robot
    # Home Assistant restores the household's explicit opt-in after restarts.

  load_optimizer_1_auto_negative_price_enabled:
    name: Dishwasher 1 Auto Negative Price
    icon: mdi:transmission-tower-export
    # Home Assistant restores the household's explicit opt-in after restarts.

  load_optimizer_1_door_opened_since_last_cycle:
    name: Dishwasher 1 Door Opened Since Last Cycle
    icon: mdi:door-open
    # Preserve this safety fact across Home Assistant restarts. It is reset when
    # the next dishwasher cycle starts, not when Home Assistant restarts.

input_text:
  load_optimizer_1_automation_package_version:
    name: Dishwasher 1 Automation Package Version
    icon: mdi:package-variant
    initial: "0.8.59"
    max: 32

  load_optimizer_1_bosch_device_id:
    name: Dishwasher 1 Bosch Device ID
    icon: mdi:identifier
    max: 255

  load_optimizer_1_bosch_power_switch:
    name: Dishwasher 1 Bosch Power Switch
    icon: mdi:power
    max: 255

  load_optimizer_1_bosch_program_select:
    name: Dishwasher 1 Bosch Program Select
    icon: mdi:format-list-bulleted-square
    max: 255

  load_optimizer_1_bosch_start_button:
    name: Dishwasher 1 Bosch Start Button
    icon: mdi:play-box-outline
    max: 255

  load_optimizer_1_bosch_selected_program_sensor:
    name: Dishwasher 1 Bosch Selected Program Sensor
    icon: mdi:format-list-checks
    max: 255

  load_optimizer_1_bosch_power_state_sensor:
    name: Dishwasher 1 Bosch Power State Sensor
    icon: mdi:power-plug
    max: 255

  load_optimizer_1_bosch_connected_sensor:
    name: Dishwasher 1 Bosch Connected Sensor
    icon: mdi:wifi-check
    max: 255

  load_optimizer_1_bosch_door_sensor:
    name: Dishwasher 1 Bosch Door Sensor
    icon: mdi:dishwasher
    max: 255

  load_optimizer_1_bosch_remote_control_sensor:
    name: Dishwasher 1 Bosch Remote Control Sensor
    icon: mdi:remote
    max: 255

  load_optimizer_1_bosch_remote_start_sensor:
    name: Dishwasher 1 Bosch Remote Start Sensor
    icon: mdi:play-network
    max: 255

  load_optimizer_1_bosch_operation_state_sensor:
    name: Dishwasher 1 Bosch Operation State Sensor
    icon: mdi:state-machine
    max: 255

  load_optimizer_1_requested_program:
    name: Dishwasher 1 Requested Program
    icon: mdi:format-list-bulleted
    max: 64

  load_optimizer_1_scheduler_message:
    name: Dishwasher 1 Scheduler Message
    icon: mdi:message-text-outline
    max: 255

  load_optimizer_1_start_attempt_status:
    name: Dishwasher 1 Start Attempt Status
    icon: mdi:play-network
    max: 64

  load_optimizer_1_start_attempt_message:
    name: Dishwasher 1 Start Attempt Message
    icon: mdi:message-alert-outline
    max: 255

  load_optimizer_1_last_start_program:
    name: Dishwasher 1 Last Start Program
    icon: mdi:format-list-bulleted
    max: 64

  load_optimizer_1_last_start_result:
    name: Dishwasher 1 Last Start Result
    icon: mdi:check-decagram
    max: 64

  load_optimizer_1_last_start_failure_reason:
    name: Dishwasher 1 Last Start Failure Reason
    icon: mdi:alert-circle-outline
    max: 255

  load_optimizer_1_last_start_mode:
    name: Dishwasher 1 Last Start Mode
    icon: mdi:gesture-tap-button
    max: 64

  load_optimizer_1_last_start_program_key:
    name: Dishwasher 1 Last Start Program Key
    icon: mdi:key-chain
    max: 128

  load_optimizer_1_last_start_selected_program:
    name: Dishwasher 1 Last Start Selected Program
    icon: mdi:format-list-checks
    max: 128

  load_optimizer_1_last_start_operation_state:
    name: Dishwasher 1 Last Start Operation State
    icon: mdi:state-machine
    max: 128

  load_optimizer_1_last_start_readiness:
    name: Dishwasher 1 Last Start Readiness
    icon: mdi:shield-check
    max: 255

  load_optimizer_1_remote_start_blocked_programs:
    name: Dishwasher 1 Remote Start Blocked Programs
    icon: mdi:playlist-remove
    max: 255

input_datetime:
  load_optimizer_1_requested_start:
    name: Dishwasher 1 Requested Start
    has_date: true
    has_time: true

  load_optimizer_1_last_start_attempt:
    name: Dishwasher 1 Last Start Attempt
    has_date: true
    has_time: true

  load_optimizer_1_last_auto_negative_price_request:
    name: Dishwasher 1 Last Auto Negative Price Request
    has_date: true
    has_time: true

  load_optimizer_1_last_auto_normal_request:
    name: Dishwasher 1 Last Automatic Normal Request
    has_date: true
    has_time: true

input_button:
  load_optimizer_1_request_now:
    name: Dishwasher 1 Request Start Now
    icon: mdi:play-circle

  load_optimizer_1_request_soon:
    name: Dishwasher 1 Request Start Soon
    icon: mdi:clock-fast

  load_optimizer_1_request_overnight:
    name: Dishwasher 1 Request Overnight
    icon: mdi:weather-night

  load_optimizer_1_cancel_schedule:
    name: Dishwasher 1 Cancel Schedule
    icon: mdi:cancel

  load_optimizer_1_request_now_override:
    name: Dishwasher 1 Request Selected Program Now
    icon: mdi:play-circle-outline

  load_optimizer_1_request_soon_override:
    name: Dishwasher 1 Request Selected Program Soon
    icon: mdi:clock-fast

  load_optimizer_1_request_overnight_override:
    name: Dishwasher 1 Request Selected Program Overnight
    icon: mdi:weather-night

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.load_optimizer_1_status
          - sensor.load_optimizer_restart_safety
          - sensor.load_optimizer_1_cycle_state
          - sensor.load_optimizer_1_overnight_recommendation
          - sensor.load_optimizer_1_negative_price_recommendation
          - sensor.load_optimizer_1_program_capabilities
          - sensor.load_optimizer_1_cost_status
          - input_boolean.load_optimizer_1_auto_mode_enabled
          - input_boolean.load_optimizer_1_auto_negative_price_enabled
          - input_boolean.load_optimizer_1_door_opened_since_last_cycle
          - input_select.load_optimizer_1_requested_mode
    sensor:
      - name: Load Optimizer 1 Overnight Readiness
        unique_id: load_optimizer_1_overnight_readiness
        icon: mdi:traffic-light
        state: >-
          {% set rec = 'sensor.load_optimizer_1_overnight_recommendation' %}
          {% set threshold = state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) %}
          {% set confidence = state_attr(rec, 'confidence') | int(0) %}
          {% set options = state_attr(rec, 'program_options') or [] %}
          {% set connected = states('input_text.load_optimizer_1_bosch_connected_sensor') %}
          {% set door = states('input_text.load_optimizer_1_bosch_door_sensor') %}
          {% set remote = states('input_text.load_optimizer_1_bosch_remote_control_sensor') %}
          {% set remote_start = states('input_text.load_optimizer_1_bosch_remote_start_sensor') %}
          {% set power = states('input_text.load_optimizer_1_bosch_power_switch') %}
          {% set hard_blocked =
             states('sensor.load_optimizer_1_status') != 'ready'
             or states('sensor.load_optimizer_restart_safety') != 'safe'
             or state_attr(rec, 'status') != 'ready'
             or options | count == 0
             or confidence < threshold
             or not is_state('input_boolean.load_optimizer_1_door_opened_since_last_cycle', 'on')
             or states(connected) != 'on'
             or states(remote) != 'on'
             or states(remote_start) != 'on' %}
          {% set waiting =
             not is_state('input_boolean.load_optimizer_1_auto_mode_enabled', 'on')
             or states('sensor.load_optimizer_1_cycle_state') != 'idle'
             or states('input_select.load_optimizer_1_requested_mode') != 'none'
             or states(door) in ['on', 'open']
             or states(power) != 'on' %}
          {{ 'red' if hard_blocked else ('amber' if waiting else 'green') }}
        attributes:
          blockers: >-
            {% set ns = namespace(items=[]) %}
            {% set rec = 'sensor.load_optimizer_1_overnight_recommendation' %}
            {% set threshold = state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) %}
            {% set confidence = state_attr(rec, 'confidence') | int(0) %}
            {% set options = state_attr(rec, 'program_options') or [] %}
            {% set connected = states('input_text.load_optimizer_1_bosch_connected_sensor') %}
            {% set remote = states('input_text.load_optimizer_1_bosch_remote_control_sensor') %}
            {% set remote_start = states('input_text.load_optimizer_1_bosch_remote_start_sensor') %}
            {% if states('sensor.load_optimizer_1_status') != 'ready' %}{% set ns.items = ns.items + ['optimizer_not_ready'] %}{% endif %}
            {% if states('sensor.load_optimizer_restart_safety') != 'safe' %}{% set ns.items = ns.items + ['active_capture_or_restart_unsafe'] %}{% endif %}
            {% if state_attr(rec, 'status') != 'ready' %}{% set ns.items = ns.items + [state_attr(rec, 'reason') or 'no_overnight_recommendation'] %}{% endif %}
            {% if options | count == 0 %}{% set ns.items = ns.items + ['no_eligible_programs'] %}{% endif %}
            {% if confidence < threshold %}{% set ns.items = ns.items + ['confidence_below_' ~ threshold] %}{% endif %}
            {% if not is_state('input_boolean.load_optimizer_1_door_opened_since_last_cycle', 'on') %}{% set ns.items = ns.items + ['door_not_opened_since_last_cycle'] %}{% endif %}
            {% if states(connected) != 'on' %}{% set ns.items = ns.items + ['dishwasher_not_connected'] %}{% endif %}
            {% if states(remote) != 'on' %}{% set ns.items = ns.items + ['remote_control_disabled'] %}{% endif %}
            {% if states(remote_start) != 'on' %}{% set ns.items = ns.items + ['remote_start_disabled'] %}{% endif %}
            {{ ns.items }}
          warnings: >-
            {% set ns = namespace(items=[]) %}
            {% set door = states('input_text.load_optimizer_1_bosch_door_sensor') %}
            {% set power = states('input_text.load_optimizer_1_bosch_power_switch') %}
            {% if not is_state('input_boolean.load_optimizer_1_auto_mode_enabled', 'on') %}{% set ns.items = ns.items + ['automatic_overnight_mode_off'] %}{% endif %}
            {% if states('sensor.load_optimizer_1_cycle_state') != 'idle' %}{% set ns.items = ns.items + ['appliance_not_idle'] %}{% endif %}
            {% if states('input_select.load_optimizer_1_requested_mode') != 'none' %}{% set ns.items = ns.items + ['request_already_pending'] %}{% endif %}
            {% if states(door) in ['on', 'open'] %}{% set ns.items = ns.items + ['door_currently_open'] %}{% endif %}
            {% if states(power) != 'on' %}{% set ns.items = ns.items + ['dishwasher_power_off_engine_will_attempt_power_on'] %}{% endif %}
            {{ ns.items }}
          program: "{{ state_attr('sensor.load_optimizer_1_overnight_recommendation', 'program') }}"
          start: "{{ state_attr('sensor.load_optimizer_1_overnight_recommendation', 'start') }}"
          confidence: "{{ state_attr('sensor.load_optimizer_1_overnight_recommendation', 'confidence') }}"
          confidence_threshold: "{{ state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) }}"

      - name: Load Optimizer 1 Negative Price Readiness
        unique_id: load_optimizer_1_negative_price_readiness
        icon: mdi:traffic-light
        state: >-
          {% set rec = 'sensor.load_optimizer_1_negative_price_recommendation' %}
          {% set threshold = state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) %}
          {% set confidence = state_attr(rec, 'confidence') | int(0) %}
          {% set capabilities = state_attr('sensor.load_optimizer_1_program_capabilities', 'programs') or [] %}
          {% set eligible = capabilities | selectattr('can_negative_price', 'eq', true) | list %}
          {% set connected = states('input_text.load_optimizer_1_bosch_connected_sensor') %}
          {% set door = states('input_text.load_optimizer_1_bosch_door_sensor') %}
          {% set remote = states('input_text.load_optimizer_1_bosch_remote_control_sensor') %}
          {% set remote_start = states('input_text.load_optimizer_1_bosch_remote_start_sensor') %}
          {% set power = states('input_text.load_optimizer_1_bosch_power_switch') %}
          {% set hard_blocked =
             states('sensor.load_optimizer_1_status') != 'ready'
             or states('sensor.load_optimizer_restart_safety') != 'safe'
             or eligible | count == 0
             or state_attr('sensor.load_optimizer_1_cost_status', 'reason') == 'maximum_runs_per_window_reached'
             or state_attr(rec, 'reason') == 'maximum_runs_per_window_reached'
             or (state_attr(rec, 'status') == 'ready' and confidence < threshold)
             or states(connected) != 'on'
             or states(remote) != 'on'
             or states(remote_start) != 'on' %}
          {% set waiting =
             not is_state('input_boolean.load_optimizer_1_auto_negative_price_enabled', 'on')
             or states('sensor.load_optimizer_1_cycle_state') != 'idle'
             or states('input_select.load_optimizer_1_requested_mode') != 'none'
             or state_attr(rec, 'status') != 'ready'
             or state_attr(rec, 'ready_to_start') != true
             or states(door) in ['on', 'open']
             or states(power) != 'on' %}
          {{ 'red' if hard_blocked else ('amber' if waiting else 'green') }}
        attributes:
          blockers: >-
            {% set ns = namespace(items=[]) %}
            {% set rec = 'sensor.load_optimizer_1_negative_price_recommendation' %}
            {% set threshold = state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) %}
            {% set confidence = state_attr(rec, 'confidence') | int(0) %}
            {% set capabilities = state_attr('sensor.load_optimizer_1_program_capabilities', 'programs') or [] %}
            {% set eligible = capabilities | selectattr('can_negative_price', 'eq', true) | list %}
            {% set connected = states('input_text.load_optimizer_1_bosch_connected_sensor') %}
            {% set remote = states('input_text.load_optimizer_1_bosch_remote_control_sensor') %}
            {% set remote_start = states('input_text.load_optimizer_1_bosch_remote_start_sensor') %}
            {% if states('sensor.load_optimizer_1_status') != 'ready' %}{% set ns.items = ns.items + ['optimizer_not_ready'] %}{% endif %}
            {% if states('sensor.load_optimizer_restart_safety') != 'safe' %}{% set ns.items = ns.items + ['active_capture_or_restart_unsafe'] %}{% endif %}
            {% if eligible | count == 0 %}{% set ns.items = ns.items + ['no_negative_price_programs_enabled'] %}{% endif %}
            {% if state_attr('sensor.load_optimizer_1_cost_status', 'reason') == 'maximum_runs_per_window_reached' %}{% set ns.items = ns.items + ['maximum_runs_per_window_reached'] %}{% endif %}
            {% if state_attr(rec, 'reason') == 'maximum_runs_per_window_reached' and 'maximum_runs_per_window_reached' not in ns.items %}{% set ns.items = ns.items + ['maximum_runs_per_window_reached'] %}{% endif %}
            {% if state_attr(rec, 'status') == 'ready' and confidence < threshold %}{% set ns.items = ns.items + ['confidence_below_' ~ threshold] %}{% endif %}
            {% if states(connected) != 'on' %}{% set ns.items = ns.items + ['dishwasher_not_connected'] %}{% endif %}
            {% if states(remote) != 'on' %}{% set ns.items = ns.items + ['remote_control_disabled'] %}{% endif %}
            {% if states(remote_start) != 'on' %}{% set ns.items = ns.items + ['remote_start_disabled'] %}{% endif %}
            {{ ns.items }}
          warnings: >-
            {% set ns = namespace(items=[]) %}
            {% set rec = 'sensor.load_optimizer_1_negative_price_recommendation' %}
            {% set door = states('input_text.load_optimizer_1_bosch_door_sensor') %}
            {% set power = states('input_text.load_optimizer_1_bosch_power_switch') %}
            {% if not is_state('input_boolean.load_optimizer_1_auto_negative_price_enabled', 'on') %}{% set ns.items = ns.items + ['automatic_negative_price_mode_off'] %}{% endif %}
            {% if states('sensor.load_optimizer_1_cycle_state') != 'idle' %}{% set ns.items = ns.items + ['appliance_not_idle'] %}{% endif %}
            {% if states('input_select.load_optimizer_1_requested_mode') != 'none' %}{% set ns.items = ns.items + ['request_already_pending'] %}{% endif %}
            {% if state_attr(rec, 'status') != 'ready' %}{% set ns.items = ns.items + [state_attr(rec, 'reason') or 'no_negative_price_window'] %}{% endif %}
            {% if state_attr(rec, 'status') == 'ready' and state_attr(rec, 'ready_to_start') != true %}{% set ns.items = ns.items + ['negative_window_not_started'] %}{% endif %}
            {% if not is_state('input_boolean.load_optimizer_1_door_opened_since_last_cycle', 'on') %}{% set ns.items = ns.items + ['door_not_opened_not_required_for_negative_mode'] %}{% endif %}
            {% if states(door) in ['on', 'open'] %}{% set ns.items = ns.items + ['door_currently_open'] %}{% endif %}
            {% if states(power) != 'on' %}{% set ns.items = ns.items + ['dishwasher_power_off_engine_will_attempt_power_on'] %}{% endif %}
            {{ ns.items }}
          program: "{{ state_attr('sensor.load_optimizer_1_negative_price_recommendation', 'program') }}"
          start: "{{ state_attr('sensor.load_optimizer_1_negative_price_recommendation', 'start') }}"
          confidence: "{{ state_attr('sensor.load_optimizer_1_negative_price_recommendation', 'confidence') }}"
          confidence_threshold: "{{ state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) }}"
          runs_in_window: "{{ state_attr('sensor.load_optimizer_1_negative_price_recommendation', 'negative_window_runs') }}"
          maximum_runs_per_window: "{{ state_attr('sensor.load_optimizer_1_negative_price_recommendation', 'maximum_runs_per_window') }}"

automation:
  - id: load_optimizer_1_register_automation_package_version
    alias: Load Optimizer 1 - Register Automation Package Version
    description: Keep the package version helper aligned after package updates.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/6"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_automation_package_version
        data:
          value: "0.8.59"

  - id: load_optimizer_1_capture_user_request
    alias: Load Optimizer 1 - Capture User Request
    description: Store a dishwasher run request from dashboard, voice, or automation controls.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_now
        id: now
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_soon
        id: soon
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_overnight
        id: overnight
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_now_override
        id: now_override
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_soon_override
        id: soon_override
      - trigger: state
        entity_id: input_button.load_optimizer_1_request_overnight_override
        id: overnight_override
    variables:
      override_request: "{{ trigger.id.endswith('_override') }}"
      requested_mode: "{{ trigger.id | replace('_override', '') }}"
      requested_override_program: "{{ states('input_select.load_optimizer_1_override_program') }}"
      override_program_requested: >-
        {{ override_request
           and requested_override_program not in ['engine', 'unknown', 'unavailable', 'none', None, ''] }}
      recommendation_entity: "{{ 'sensor.load_optimizer_1_' ~ requested_mode ~ '_recommendation' }}"
      recommendation_status: "{{ state_attr(recommendation_entity, 'status') }}"
      engine_program: >-
        {{ state_attr(recommendation_entity, 'program') or states(recommendation_entity) }}
      engine_start: "{{ state_attr(recommendation_entity, 'start') }}"
      program_options: "{{ state_attr(recommendation_entity, 'program_options') or [] }}"
      recommendation_program: >-
        {% if override_program_requested %}
          {% set ns = namespace(program=requested_override_program) %}
          {% for option in program_options %}
            {% if option.program == requested_override_program %}
              {% set ns.program = option.program %}
            {% endif %}
          {% endfor %}
          {{ ns.program }}
        {% else %}
          {{ engine_program }}
        {% endif %}
      recommendation_start: >-
        {% if override_program_requested and requested_mode == 'now' %}
          {{ now().isoformat() }}
        {% elif override_program_requested %}
          {% set ns = namespace(start='') %}
          {% for option in program_options %}
            {% if option.program == requested_override_program %}
              {% set ns.start = option.start %}
            {% endif %}
          {% endfor %}
          {{ ns.start }}
        {% else %}
          {{ engine_start }}
        {% endif %}
      message: >-
        Dishwasher {{ requested_mode }} request captured:
        {{ recommendation_program }} at {{ recommendation_start }}.
    actions:
      - condition: template
        value_template: >-
          {{ (recommendation_status == 'ready' or (override_program_requested and requested_mode == 'now'))
             and recommendation_program not in ['unknown', 'unavailable', 'none', None, '']
             and recommendation_start not in ['unknown', 'unavailable', 'none', None, ''] }}
      - action: input_select.select_option
        target:
          entity_id: input_select.load_optimizer_1_requested_mode
        data:
          option: "{{ requested_mode }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_requested_program
        data:
          value: "{{ recommendation_program }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_requested_start
        data:
          datetime: "{{ as_local(as_datetime(recommendation_start)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_scheduler_message
        data:
          value: "{{ message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_start_attempt_status
        data:
          value: pending
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_start_attempt_message
        data:
          value: "{{ message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.announce_text
        data:
          value: "{{ message[:255] }}"
      - action: script.turn_on
        target:
          entity_id: script.load_optimizer_announce

  - id: load_optimizer_1_auto_negative_price_request
    alias: Load Optimizer 1 - Auto Negative Price Request
    description: Opt-in unattended request creation when Load Optimizer finds a ready negative-price run.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: sensor.load_optimizer_1_negative_price_recommendation
    variables:
      recommendation_entity: sensor.load_optimizer_1_negative_price_recommendation
      recommendation_status: "{{ state_attr(recommendation_entity, 'status') }}"
      recommendation_program: >-
        {{ state_attr(recommendation_entity, 'program') or states(recommendation_entity) }}
      recommendation_start: "{{ state_attr(recommendation_entity, 'start') }}"
      recommendation_ready_to_start: "{{ state_attr(recommendation_entity, 'ready_to_start') }}"
      recommendation_confidence: "{{ state_attr(recommendation_entity, 'confidence') | int(0) }}"
      confidence_threshold: "{{ state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) }}"
      recommendation_reason: "{{ state_attr(recommendation_entity, 'reason') }}"
      auto_cooldown_minutes: 30
      last_auto_request: "{{ states('input_datetime.load_optimizer_1_last_auto_negative_price_request') }}"
      auto_cooldown_elapsed: >-
        {{ last_auto_request in ['unknown', 'unavailable', 'none', None, '']
           or as_timestamp(now()) >= as_timestamp(as_datetime(last_auto_request)) + (auto_cooldown_minutes * 60) }}
      message: >-
        Dishwasher automatic negative-price request captured:
        {{ recommendation_program }} at {{ recommendation_start }}.
    conditions:
      - condition: state
        entity_id: input_boolean.load_optimizer_1_auto_negative_price_enabled
        state: "on"
      - condition: state
        entity_id: sensor.load_optimizer_restart_safety
        state: safe
      - condition: state
        entity_id: sensor.load_optimizer_1_cycle_state
        state: idle
      - condition: state
        entity_id: input_select.load_optimizer_1_requested_mode
        state: none
      - condition: template
        value_template: >-
          {{ recommendation_status == 'ready'
             and recommendation_ready_to_start == true
             and recommendation_program not in ['unknown', 'unavailable', 'none', None, '']
             and recommendation_start not in ['unknown', 'unavailable', 'none', None, '']
             and recommendation_confidence >= confidence_threshold
             and auto_cooldown_elapsed }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.load_optimizer_1_requested_mode
        data:
          option: negative_price
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_requested_program
        data:
          value: "{{ recommendation_program }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_requested_start
        data:
          datetime: "{{ as_local(as_datetime(recommendation_start)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_last_auto_negative_price_request
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_scheduler_message
        data:
          value: "{{ message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.announce_text
        data:
          value: "{{ message[:255] }}"
      - action: script.turn_on
        target:
          entity_id: script.load_optimizer_announce

  - id: load_optimizer_1_auto_normal_request
    alias: Load Optimizer 1 - Auto Overnight Request
    description: >-
      Opt-in unattended normal-run request for the overnight recommendation
      after a fresh dishwasher door opening. This never creates a daytime
      immediate start.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.load_optimizer_1_overnight_recommendation
          - sensor.load_optimizer_1_cycle_state
          - input_boolean.load_optimizer_1_door_opened_since_last_cycle
    variables:
      recommendation_entity: sensor.load_optimizer_1_overnight_recommendation
      recommendation_status: "{{ state_attr(recommendation_entity, 'status') }}"
      recommendation_program: >-
        {{ state_attr(recommendation_entity, 'program') or states(recommendation_entity) }}
      recommendation_start: "{{ state_attr(recommendation_entity, 'start') }}"
      recommendation_confidence: "{{ state_attr(recommendation_entity, 'confidence') | int(0) }}"
      confidence_threshold: "{{ state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) }}"
      auto_cooldown_minutes: 30
      last_auto_request: "{{ states('input_datetime.load_optimizer_1_last_auto_normal_request') }}"
      auto_cooldown_elapsed: >-
        {{ last_auto_request in ['unknown', 'unavailable', 'none', None, '']
           or as_timestamp(now()) >= as_timestamp(as_datetime(last_auto_request)) + (([(auto_cooldown_minutes | int(0)), 720] | max) * 60) }}
      message: >-
        Dishwasher automatic overnight request queued:
        {{ recommendation_program }} at {{ recommendation_start }}.
    conditions:
      - condition: state
        entity_id: input_boolean.load_optimizer_1_auto_mode_enabled
        state: "on"
      - condition: state
        entity_id: sensor.load_optimizer_restart_safety
        state: safe
      - condition: state
        entity_id: sensor.load_optimizer_1_cycle_state
        state: idle
      - condition: state
        entity_id: input_select.load_optimizer_1_requested_mode
        state: none
      - condition: state
        entity_id: input_boolean.load_optimizer_1_door_opened_since_last_cycle
        state: "on"
      - condition: template
        value_template: >-
          {{ recommendation_status == 'ready'
             and recommendation_program not in ['unknown', 'unavailable', 'none', None, '']
             and recommendation_start not in ['unknown', 'unavailable', 'none', None, '']
             and recommendation_confidence >= confidence_threshold
             and as_timestamp(as_datetime(recommendation_start)) > as_timestamp(now())
             and auto_cooldown_elapsed }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.load_optimizer_1_requested_mode
        data:
          option: automatic
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_requested_program
        data:
          value: "{{ recommendation_program }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_requested_start
        data:
          datetime: "{{ as_local(as_datetime(recommendation_start)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_last_auto_normal_request
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_scheduler_message
        data:
          value: "{{ message[:255] }}"

  - id: load_optimizer_1_cancel_user_request
    alias: Load Optimizer 1 - Cancel User Request
    description: Clear the dishwasher scheduler helpers.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.load_optimizer_1_cancel_schedule
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.load_optimizer_1_requested_mode
        data:
          option: none
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_requested_program
        data:
          value: ""

  - id: load_optimizer_1_reset_door_open_flag_on_cycle_start
    alias: Load Optimizer 1 - Reset Door Open Flag On Cycle Start
    description: Require a fresh door opening before another normal cycle.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.load_optimizer_1_cycle_state
        to: running
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.load_optimizer_1_door_opened_since_last_cycle

  - id: load_optimizer_1_track_door_open
    alias: Load Optimizer 1 - Track Door Open
    description: Record that the dishwasher door has been opened since the last cycle.
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set door_sensor = states('input_text.load_optimizer_1_bosch_door_sensor') %}
          {{ door_sensor not in ['unknown', 'unavailable', 'none', '']
             and states(door_sensor) in ['on', 'open'] }}
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: input_text.load_optimizer_1_bosch_door_sensor
    variables:
      door_sensor: "{{ states('input_text.load_optimizer_1_bosch_door_sensor') }}"
    conditions:
      - condition: template
        value_template: >-
          {{ door_sensor not in ['unknown', 'unavailable', 'none', '']
             and states(door_sensor) in ['on', 'open']
             and is_state('input_boolean.load_optimizer_1_door_opened_since_last_cycle', 'off') }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.load_optimizer_1_door_opened_since_last_cycle

  - id: load_optimizer_1_execute_user_request
    alias: Load Optimizer 1 - Execute User Request
    description: Start the Bosch dishwasher when the requested Load Optimizer recommendation is due.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.load_optimizer_1_now_recommendation
          - sensor.load_optimizer_1_soon_recommendation
          - sensor.load_optimizer_1_overnight_recommendation
          - sensor.load_optimizer_1_negative_price_recommendation
          - input_select.load_optimizer_1_requested_mode
          - input_datetime.load_optimizer_1_requested_start
    variables:
      requested_mode: "{{ states('input_select.load_optimizer_1_requested_mode') }}"
      bosch_device_id: "{{ states('input_text.load_optimizer_1_bosch_device_id') }}"
      bosch_power_switch: "{{ states('input_text.load_optimizer_1_bosch_power_switch') }}"
      bosch_program_select: "{{ states('input_text.load_optimizer_1_bosch_program_select') }}"
      bosch_start_button: "{{ states('input_text.load_optimizer_1_bosch_start_button') }}"
      bosch_selected_program_sensor: "{{ states('input_text.load_optimizer_1_bosch_selected_program_sensor') }}"
      bosch_power_state_sensor: "{{ states('input_text.load_optimizer_1_bosch_power_state_sensor') }}"
      bosch_connected_sensor: "{{ states('input_text.load_optimizer_1_bosch_connected_sensor') }}"
      bosch_door_sensor: "{{ states('input_text.load_optimizer_1_bosch_door_sensor') }}"
      bosch_remote_control_sensor: "{{ states('input_text.load_optimizer_1_bosch_remote_control_sensor') }}"
      bosch_remote_start_sensor: "{{ states('input_text.load_optimizer_1_bosch_remote_start_sensor') }}"
      bosch_operation_state_sensor: "{{ states('input_text.load_optimizer_1_bosch_operation_state_sensor') }}"
      recommendation_entity: >-
        {{ 'sensor.load_optimizer_1_overnight_recommendation'
           if requested_mode == 'automatic'
           else ('sensor.load_optimizer_1_' ~ requested_mode ~ '_recommendation'
                 if requested_mode in ['now', 'soon', 'overnight', 'negative_price'] else '') }}
      recommendation_status: "{{ state_attr(recommendation_entity, 'status') }}"
      recommendation_program: >-
        {{ state_attr(recommendation_entity, 'program') or states(recommendation_entity) }}
      recommendation_start: "{{ state_attr(recommendation_entity, 'start') }}"
      recommendation_ready_to_start: "{{ state_attr(recommendation_entity, 'ready_to_start') }}"
      current_program_options: "{{ state_attr(recommendation_entity, 'program_options') or [] }}"
      requested_program: "{{ states('input_text.load_optimizer_1_requested_program') }}"
      requested_start: "{{ states('input_datetime.load_optimizer_1_requested_start') }}"
      selected_start: >-
        {{ requested_start
           if requested_start not in ['unknown', 'unavailable', 'none', None, '']
           else recommendation_start }}
      maximum_start_lag_minutes: 30
      selected_program: >-
        {{ requested_program
           if requested_program not in ['unknown', 'unavailable', 'none', None, '']
           else recommendation_program }}
      queued_program_option: >-
        {{ current_program_options
           | selectattr('program', 'eq', selected_program)
           | list | first | default({}, true) }}
      confidence_threshold: >-
        {{ state_attr('sensor.load_optimizer_1_schedule_status', 'confidence_threshold') | int(20) }}
      queued_program_confidence: "{{ queued_program_option.confidence | default(0, true) | int(0) }}"
      queued_option_start: "{{ queued_program_option.start | default('', true) }}"
      queued_start_delta_minutes: >-
        {% if queued_option_start not in ['unknown', 'unavailable', 'none', None, '']
              and selected_start not in ['unknown', 'unavailable', 'none', None, ''] %}
          {{ ((((as_timestamp(as_datetime(queued_option_start)) - as_timestamp(as_datetime(selected_start))) | abs) / 60)) | round(1) }}
        {% else %}
          9999
        {% endif %}
      queued_plan_invalid: >-
        {{ requested_mode in ['automatic', 'negative_price']
           and (recommendation_status != 'ready'
                or not queued_program_option
                or queued_program_confidence < confidence_threshold
                or queued_start_delta_minutes | float(9999) > 15) }}
      selected_program_key: >-
        {% set program_map = {
          'Eco50': 'Dishcare.Dishwasher.Program.Eco50',
          'Auto2': 'Dishcare.Dishwasher.Program.Auto2',
          'Intensiv70': 'Dishcare.Dishwasher.Program.Intensiv70',
          'Quick65': 'Dishcare.Dishwasher.Program.Quick65',
          'Glas40': 'Dishcare.Dishwasher.Program.Glas40',
          'MachineCare': 'Dishcare.Dishwasher.Program.MachineCare',
          'PreRinse': 'Dishcare.Dishwasher.Program.PreRinse',
          'IntensivPower': 'Dishcare.Dishwasher.Program.IntensivPower',
          'MixedLoad': 'Dishcare.Dishwasher.Program.MixedLoad',
          'Quick45': 'Dishcare.Dishwasher.Program.Quick45',
          'QuickD': 'Dishcare.Dishwasher.Program.QuickD',
          'NightWash': 'Dishcare.Dishwasher.Program.NightWash',
          'Super60': 'Dishcare.Dishwasher.Program.Super60',
          'Kurz60': 'Dishcare.Dishwasher.Program.Kurz60'
        } %}
        {{ program_map.get(selected_program, selected_program) }}
      bosch_ready: >-
        {{ states(bosch_connected_sensor) == 'on'
           and states(bosch_door_sensor) == 'off'
           and states(bosch_remote_control_sensor) == 'on'
           and states(bosch_remote_start_sensor) == 'on' }}
      bosch_ready_summary: >-
        connected={{ bosch_connected_sensor }}={{ states(bosch_connected_sensor) }};
        door={{ bosch_door_sensor }}={{ states(bosch_door_sensor) }};
        remote={{ bosch_remote_control_sensor }}={{ states(bosch_remote_control_sensor) }};
        remote_start={{ bosch_remote_start_sensor }}={{ states(bosch_remote_start_sensor) }}
      negative_price_mode: "{{ requested_mode == 'negative_price' }}"
      negative_power_window_fit: >-
        {{ requested_mode != 'negative_price'
           or state_attr(recommendation_entity, 'power_hungry_window_fits_negative_price') == true }}
      door_opened_since_last_cycle: >-
        {{ is_state('input_boolean.load_optimizer_1_door_opened_since_last_cycle', 'on') }}
      door_gate_failed: "{{ not negative_price_mode and not door_opened_since_last_cycle }}"
      due_by_time: >-
        {{ selected_start not in ['unknown', 'unavailable', 'none', None, '']
           and as_timestamp(now()) >= as_timestamp(as_datetime(selected_start)) }}
      stale_request: >-
        {{ selected_start not in ['unknown', 'unavailable', 'none', None, '']
           and as_timestamp(now()) > as_timestamp(as_datetime(selected_start)) + (maximum_start_lag_minutes * 60) }}
      due_now: >-
        {{ requested_mode == 'now'
           and (recommendation_ready_to_start == true or due_by_time) }}
      due_scheduled: >-
        {{ requested_mode in ['soon', 'overnight', 'negative_price', 'automatic'] and due_by_time }}
      manual_now_override: >-
        {{ requested_mode == 'now'
           and requested_program not in ['unknown', 'unavailable', 'none', None, '']
           and selected_start not in ['unknown', 'unavailable', 'none', None, ''] }}
      start_message: >-
        Dishwasher start requested by Load Optimizer:
        {{ selected_program }}.
      executing_message: >-
        Dishwasher execution started for {{ selected_program }}.
        key={{ selected_program_key }},
        due={{ selected_start }}.
      stale_request_message: >-
        Dishwasher start request expired without being run:
        {{ selected_program }} was due at {{ selected_start }}.
        Please request a fresh schedule.
      stale_request_reason: >-
        stale_request program={{ selected_program }}
        due={{ selected_start }}
        lag_limit_minutes={{ maximum_start_lag_minutes }}
      revalidation_message: >-
        Dishwasher automatic request cancelled because the queued plan is no
        longer eligible. program={{ selected_program }},
        recommendation={{ recommendation_status }},
        confidence={{ queued_program_confidence }}/{{ confidence_threshold }},
        start_delta={{ queued_start_delta_minutes }} minutes.
      revalidation_reason: >-
        queued_plan_no_longer_eligible program={{ selected_program }}
        recommendation={{ recommendation_status }}
        confidence={{ queued_program_confidence }}/{{ confidence_threshold }}
        start_delta_minutes={{ queued_start_delta_minutes }}
      not_ready_message: >-
        Dishwasher is not ready to start {{ selected_program }}.
        {{ bosch_ready_summary }}.
      not_ready_reason: >-
        not_ready {{ bosch_ready_summary }}
      door_gate_message: >-
        Dishwasher start blocked because the door has not been opened since the
        previous cycle. Open the door and submit a fresh request.
      negative_window_message: >-
        Negative-price start blocked because the power-hungry part of
        {{ selected_program }} does not fit inside the negative-price window.
      not_startable_message: >-
        Dishwasher program is not selectable from Home Assistant:
        program={{ selected_program }},
        key={{ selected_program_key }},
        available={{ state_attr(bosch_program_select, 'options') or [] }}.
      not_startable_reason: >-
        program_not_selectable program={{ selected_program }}
        key={{ selected_program_key }}
      failed_message: >-
        Dishwasher start failed for {{ selected_program }}.
        key={{ selected_program_key }},
        switch={{ states(bosch_power_switch) }},
        power={{ states(bosch_power_state_sensor) }},
        selected={{ states(bosch_selected_program_sensor) }},
        operation={{ states(bosch_operation_state_sensor) }}.
      failed_reason: >-
        not_running_after_start key={{ selected_program_key }}
        selected={{ states(bosch_selected_program_sensor) }}
        operation={{ states(bosch_operation_state_sensor) }}
      blocked_programs_after_failure: >-
        {% set raw = states('input_text.load_optimizer_1_remote_start_blocked_programs') %}
        {% set existing = raw.split(',') | map('trim') | reject('eq', '') | list
           if raw not in ['unknown', 'unavailable', 'none', None, ''] else [] %}
        {{ (existing + [selected_program]) | unique | join(',') }}
      blocked_programs_after_success: >-
        {% set raw = states('input_text.load_optimizer_1_remote_start_blocked_programs') %}
        {% set existing = raw.split(',') | map('trim') | reject('eq', '') | list
           if raw not in ['unknown', 'unavailable', 'none', None, ''] else [] %}
        {{ existing | reject('eq', selected_program) | list | join(',') }}
    conditions:
      - condition: template
        value_template: "{{ requested_mode in ['now', 'soon', 'overnight', 'negative_price', 'automatic'] }}"
      - condition: template
        value_template: >-
          {{ recommendation_status == 'ready'
             or manual_now_override
             or stale_request
             or requested_mode in ['automatic', 'negative_price'] }}
      - condition: template
        value_template: "{{ selected_program not in ['unknown', 'unavailable', 'none', None, ''] }}"
      - condition: template
        value_template: "{{ states('sensor.load_optimizer_1_cycle_state') == 'idle' }}"
      - condition: template
        value_template: "{{ due_now or due_scheduled or stale_request }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_start_attempt_status
        data:
          value: attempting
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_program
        data:
          value: "{{ selected_program }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_result
        data:
          value: pending
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_failure_reason
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_mode
        data:
          value: "{{ requested_mode }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_program_key
        data:
          value: "{{ selected_program_key[:128] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_last_start_readiness
        data:
          value: "{{ bosch_ready_summary[:255] }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_optimizer_1_last_start_attempt
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.announce_text
        data:
          value: "{{ start_message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_start_attempt_message
        data:
          value: "{{ executing_message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_scheduler_message
        data:
          value: "{{ executing_message[:255] }}"
      - action: script.turn_on
        target:
          entity_id: script.load_optimizer_announce
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ queued_plan_invalid }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ revalidation_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: cancelled
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: cancelled
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: "{{ revalidation_reason[:255] }}"
          - conditions:
              - condition: template
                value_template: "{{ negative_price_mode and not negative_power_window_fit }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ negative_window_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: negative_power_window_mismatch
              - action: input_select.select_option
                target:
                  entity_id: input_select.load_optimizer_1_requested_mode
                data:
                  option: none
          - conditions:
              - condition: template
                value_template: "{{ door_gate_failed }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ door_gate_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: door_not_opened_since_last_cycle
              - action: input_select.select_option
                target:
                  entity_id: input_select.load_optimizer_1_requested_mode
                data:
                  option: none
          - conditions:
              - condition: template
                value_template: "{{ stale_request }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.announce_text
                data:
                  value: "{{ stale_request_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ stale_request_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: expired
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: expired
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: "{{ stale_request_reason[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_message
                data:
                  value: "{{ stale_request_message[:255] }}"
              - action: script.turn_on
                target:
                  entity_id: script.load_optimizer_announce
          - conditions:
              - condition: template
                value_template: "{{ not bosch_ready }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.announce_text
                data:
                  value: "{{ not_ready_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ not_ready_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: "{{ not_ready_reason[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_message
                data:
                  value: "{{ not_ready_message[:255] }}"
              - action: script.turn_on
                target:
                  entity_id: script.load_optimizer_announce
          - conditions:
              - condition: template
                value_template: >-
                  {{ selected_program_key not in (state_attr(bosch_program_select, 'options') or []) }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.announce_text
                data:
                  value: "{{ not_startable_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ not_startable_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: blocked
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: "{{ not_startable_reason[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_message
                data:
                  value: "{{ not_startable_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_remote_start_blocked_programs
                data:
                  value: "{{ blocked_programs_after_failure[:255] }}"
              - action: script.turn_on
                target:
                  entity_id: script.load_optimizer_announce
        default:
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ bosch_power_switch }}"
          - delay:
              seconds: 15
          - action: input_text.set_value
            target:
              entity_id: input_text.load_optimizer_1_scheduler_message
            data:
              value: >-
                Dishwasher power step complete.
                switch={{ states(bosch_power_switch) }},
                power={{ states(bosch_power_state_sensor) }}.
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ bosch_program_select }}"
            data:
              option: "{{ selected_program_key }}"
          - delay:
              seconds: 5
          - action: input_text.set_value
            target:
              entity_id: input_text.load_optimizer_1_scheduler_message
            data:
              value: >-
                Dishwasher program step complete.
                requested={{ selected_program_key }},
                selected={{ states(bosch_selected_program_sensor) }}.
          - action: input_text.set_value
            target:
              entity_id: input_text.load_optimizer_1_last_start_selected_program
            data:
              value: "{{ states(bosch_selected_program_sensor)[:128] }}"
          - action: button.press
            continue_on_error: true
            target:
              entity_id: "{{ bosch_start_button }}"
          - delay:
              seconds: 20
          - action: input_text.set_value
            target:
              entity_id: input_text.load_optimizer_1_scheduler_message
            data:
              value: >-
                Dishwasher button start attempted.
                operation={{ states(bosch_operation_state_sensor) }},
                cycle={{ states('sensor.load_optimizer_1_cycle_state') }}.
          - action: input_text.set_value
            target:
              entity_id: input_text.load_optimizer_1_last_start_operation_state
            data:
              value: "{{ states(bosch_operation_state_sensor)[:128] }}"
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.load_optimizer_1_cycle_state') != 'running'
                     and states(bosch_operation_state_sensor) != 'BSH.Common.EnumType.OperationState.Run' }}
            then:
              - action: home_connect_alt.start_program
                continue_on_error: true
                data:
                  validate: true
                  device_id: "{{ bosch_device_id }}"
                  program_key: "{{ selected_program_key }}"
          - delay:
              seconds: 20
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.load_optimizer_1_cycle_state') != 'running'
                     and states(bosch_operation_state_sensor) != 'BSH.Common.EnumType.OperationState.Run' }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: >-
                    Dishwasher Home Connect Alt fallback attempted.
                    operation={{ states(bosch_operation_state_sensor) }},
                    cycle={{ states('sensor.load_optimizer_1_cycle_state') }}.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.load_optimizer_1_cycle_state') != 'running'
                     and states(bosch_operation_state_sensor) != 'BSH.Common.EnumType.OperationState.Run' }}
            then:
              - action: home_connect.start_program
                continue_on_error: true
                data:
                  validate: true
                  device_id: "{{ bosch_device_id }}"
                  program_key: "{{ selected_program_key }}"
          - delay:
              minutes: 2
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.load_optimizer_1_cycle_state') == 'running'
                     or states(bosch_operation_state_sensor) == 'BSH.Common.EnumType.OperationState.Run' }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: confirmed
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: confirmed
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: ""
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_message
                data:
                  value: >-
                    Dishwasher started successfully.
                    program={{ selected_program }},
                    operation={{ states(bosch_operation_state_sensor) }}.
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_remote_start_blocked_programs
                data:
                  value: "{{ blocked_programs_after_success[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: >-
                    Dishwasher started successfully.
                    program={{ selected_program }},
                    operation={{ states(bosch_operation_state_sensor) }}.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.load_optimizer_1_cycle_state') != 'running'
                     and states(bosch_operation_state_sensor) != 'BSH.Common.EnumType.OperationState.Run' }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_status
                data:
                  value: failed
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_result
                data:
                  value: failed
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_last_start_failure_reason
                data:
                  value: "{{ failed_reason[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_start_attempt_message
                data:
                  value: "{{ failed_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.announce_text
                data:
                  value: "{{ failed_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_scheduler_message
                data:
                  value: "{{ failed_message[:255] }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.load_optimizer_1_remote_start_blocked_programs
                data:
                  value: "{{ blocked_programs_after_failure[:255] }}"
              - action: script.turn_on
                target:
                  entity_id: script.load_optimizer_announce
      - action: input_select.select_option
        target:
          entity_id: input_select.load_optimizer_1_requested_mode
        data:
          option: none
      - action: input_text.set_value
        target:
          entity_id: input_text.load_optimizer_1_requested_program
        data:
          value: ""
