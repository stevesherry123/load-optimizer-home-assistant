        | Program | Runs | Runtime | Energy | Confidence | Class | Normal | Negative | Cooldown | Auto | Remote |

        |---|---:|---:|---:|---:|---|---:|---:|---:|---:|---|

        {%- for item in catalogue %}

        {%- set capability = (capabilities | selectattr(''program'', ''eq'', item.program) | list | first) or {} %}

        | {{ item.program }} | {{ item.runs }} | {{ (item.expected_runtime_minutes | round(0, ''ceil'') | int ~ '' min'') if item.expected_runtime_minutes is number else ''unknown'' }} | {{ (item.expected_energy_kwh | round(3) ~ '' kWh'') if item.expected_energy_kwh is number else ''unknown'' }} | {{ item.confidence | round(0) }}% | {{ item.classification | default(''unclassified'') }} | {{ ''yes'' if item.allow_normal_recommendation | default(false) else ''no'' }} | {{ ''yes'' if item.allow_negative_price_run | default(false) else ''no'' }} | {{ item.minimum_hours_between_runs | default(0) }} h | {{ ''yes'' if capability.can_auto_start | default(false) else ''no'' }} | {{ capability.remote_start_status | default(''unknown'') }} |

        {%- endfor %}

