- title: Diagnostics
  path: diagnostics
  icon: mdi:stethoscope
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 1
    cards:
    - type: markdown
      title: Execution record
      content: '{% set native = ''sensor.load_optimizer_1_orchestration_status'' %}

        {% macro home_time(value) -%}

        {{ (as_datetime(value) | as_local).strftime(''%a %d %b %H:%M %Z'') if as_datetime(value, none) else ''Not recorded'' }}

        {%- endmacro %}

        | Record | Value |

        |---|---|

        | Scheduler | {{ states(native) }} |

        | Last start | {{ home_time(state_attr(native, ''last_attempt'')) }} |

        | Programme | {{ state_attr(native, ''last_program'') or ''Not recorded'' }} |

        | Result | {{ state_attr(native, ''last_result'') or ''Not recorded'' }} |

        | Detail | {{ (state_attr(native, ''last_message'') or ''Not recorded'') | replace(''|'', ''/'') | replace(''\n'', '' '') }} |'
    - type: entities
      title: Sources
      show_header_toggle: false
      entities:
      - entity: sensor.load_optimizer_1_status
        name: Optimizer
      - entity: sensor.load_optimizer_1_data_freshness
        name: Data freshness
      - entity: sensor.load_optimizer_1_tariff_horizon
        name: Published horizon
    - type: entities
      title: Readiness
      show_header_toggle: false
      entities:
      - entity: sensor.load_optimizer_1_overnight_readiness
        name: Overnight
      - entity: sensor.load_optimizer_1_negative_price_readiness
        name: Free / negative price
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      title: Recent decisions
      content: '{% set records = state_attr(''sensor.load_optimizer_1_automation_explanation'', ''recent_events'') or [] %}

        {% if records %}

        | Home time | Event | Programme / reason |

        |---|---|---|

        {% for event in records[:12] -%}

        | {{ (as_datetime(event.timestamp) | as_local).strftime(''%d %b %H:%M %Z'') if as_datetime(event.timestamp, none) else ''Not recorded'' }} | {{ event.event | default(''decision'') }} | {{ event.program | default(event.reason | default('''')) | replace(''_'', '' '') }} |

        {% endfor -%}

        {% else %}

        No scheduling events recorded.

        {% endif %}'
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      title: Automation Capabilities
      grid_options:
        columns: full
      content: '{% set programs = state_attr(''sensor.load_optimizer_1_program_capabilities'', ''programs'') or [] %}

        {% if programs %}

        {% for item in programs %}

        ### {{ item.program }}


        **Learned:** {{ item.runs }} runs, {{ item.confidence }}% confidence, {{ item.classification }}


        - **Normal recommendation:** {{ ''eligible'' if item.can_recommend else ''not eligible'' }}

        - **Free / negative price:** {{ ''eligible'' if item.can_negative_price else ''not eligible'' }}

        - **Automatic start:** {{ ''available'' if item.can_auto_start else ''blocked'' }}

        - **Remote start:** {{ item.remote_start_status | replace(''_'', '' '') }}


        {% endfor %}

        {% else %}

        No automation-capability data has been published yet.

        {% endif %}'
