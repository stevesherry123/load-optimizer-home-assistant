title: Load Optimizer
views:
  - title: Overview
    path: load-optimizer
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: App Status
            entities:
              - entity: sensor.load_optimizer_status
                name: App Status
          - type: markdown
            title: Global Status
            content: |
              **Status:** {{ states('sensor.load_optimizer_status') }}


              **Version:** {{ state_attr('sensor.load_optimizer_status',
              'version') }}


              **Instances:** {{ state_attr('sensor.load_optimizer_status',
              'instances') }}


              {% set captures = state_attr('sensor.load_optimizer_status',
              'active_capture_instances') or [] %}

              **Active captures:** {% if captures | count == 0 %}none{% else %}
              {% for capture in captures %}
              {% set capture_name = capture.name | default('Instance ' ~ (capture.instance_id | default('unknown')), true) %}
              {% set capture_program = capture.program | default('unknown', true) %}
              {% set capture_start = capture.cycle_start | default(none, true) %}
              {% set capture_finish = capture.estimated_finish | default(none, true) %}
              {% set remaining = capture.estimated_remaining_minutes | default(none, true) %}
              - **{{ capture_name }}**{% if capture_program not in ['', 'unknown', 'none', 'None'] %} ({{ capture_program }}){% endif %}: started {{ (capture_start | as_datetime | as_local).strftime('%a %d %b %H:%M') if capture_start else 'unknown' }}{% if capture_finish %}; estimated finish {{ (capture_finish | as_datetime | as_local).strftime('%a %d %b %H:%M') }}{% endif %} ({% if remaining is not none %}{{ remaining }} min remaining{% else %}learning duration{% endif %})
              {% endfor %}{% endif %}


              **Reset status:** {{ state_attr('sensor.load_optimizer_status',
              'reset_status') or 'idle' }}


              **Reset message:** {{ state_attr('sensor.load_optimizer_status',
              'reset_message') or 'none' }}
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            header:
              show: true
              title: Octopus Prices
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Now
              color: "#0ea5e9"
            experimental:
              color_threshold: true
            apex_config:
              chart:
                height: 340
                toolbar:
                  show: false
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
              yaxis:
                - min: |
                    EVAL:function(min) {
                      return Math.min(0, min);
                    }
                  decimalsInFloat: 2
                  title:
                    text: Import price (p/kWh)
              stroke:
                curve: stepline
                width: 2
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.55
                  opacityTo: 0.15
              legend:
                show: true
              tooltip:
                x:
                  format: ddd dd MMM HH:mm
                "y":
                  formatter: |
                    EVAL:function(value) {
                      return `${Number(value).toFixed(2)} p/kWh`;
                    }
              annotations:
                yaxis:
                  - "y": 0
                    borderColor: "#16a34a"
                    strokeDashArray: 4
                    label:
                      text: Free / paid boundary
                      style:
                        color: "#ffffff"
                        background: "#16a34a"
            all_series_config:
              type: area
              unit: p/kWh
              float_precision: 2
            series:
              - entity: sensor.load_optimizer_1_current_energy_price
                name: Current
                type: line
                unit: p/kWh
                float_precision: 2
                show:
                  in_chart: false
                  in_header: true
                  legend_value: false
                transform: |
                  return Number(x);
              - entity: sensor.load_optimizer_status
                name: Import price
                show:
                  in_header: false
                  legend_value: false
                color_threshold:
                  - value: -50
                    color: "#00b050"
                  - value: 0
                    color: "#00b050"
                  - value: 15
                    color: "#92d050"
                  - value: 25
                    color: "#ffc000"
                  - value: 35
                    color: "#ff8000"
                  - value: 50
                    color: "#c00000"
                data_generator: |
                  const sourceState = hass.states['sensor.load_optimizer_1_cost_status'];
                  const rawEntities = sourceState?.attributes?.tariff_entities
                    || sourceState?.attributes?.tariff_entity
                    || '';
                  const entities = String(rawEntities)
                    .split(',')
                    .map((value) => value.trim())
                    .filter(Boolean);

                  const pointsByStart = new Map();
                  let lastEnd = null;
                  for (const entityId of entities) {
                    const rates = hass.states[entityId]?.attributes?.rates;
                    if (!Array.isArray(rates) || rates.length === 0) {
                      continue;
                    }
                    for (const entry of rates) {
                      const startRaw = entry.start || entry.valid_from || entry.from;
                      const endRaw = entry.end || entry.valid_to || entry.to;
                      const priceRaw = entry.price_p_per_kwh
                        ?? entry.value_inc_vat
                        ?? entry.value
                        ?? entry.price;
                      const start = new Date(startRaw).getTime();
                      const end = endRaw ? new Date(endRaw).getTime() : null;
                      let value = Number(priceRaw);
                      if (!Number.isFinite(start) || !Number.isFinite(value)) {
                        continue;
                      }

                      if (entry.price_p_per_kwh === undefined) {
                        value = value * 100;
                      }

                      pointsByStart.set(start, [start, value]);
                      if (Number.isFinite(end)) {
                        pointsByStart.set(end, [end, value]);
                        lastEnd = Math.max(lastEnd || end, end);
                      }
                    }
                  }

                  const points = Array.from(pointsByStart.values())
                    .sort((left, right) => left[0] - right[0]);
                  if (points.length > 0 && Number.isFinite(lastEnd)) {
                    points.push([lastEnd + 1, null]);
                  }
                  return points;
      - type: grid
        cards:
          - type: entities
            title: Dishwasher 1
            entities:
              - entity: sensor.load_optimizer_1_status
                name: Optimizer Status
              - entity: sensor.load_optimizer_1_cycle_state
                name: Cycle State
              - entity: sensor.load_optimizer_1_program
                name: Current Program
              - entity: sensor.load_optimizer_1_power
                name: Current Power
              - entity: sensor.load_optimizer_1_sample_count
                name: Current Samples
              - entity: sensor.load_optimizer_1_total_runs
                name: Total Runs
          - type: entities
            title: Dishwasher 1 Scheduling
            entities:
              - entity: sensor.load_optimizer_1_schedule_status
                name: Schedule Status
              - entity: sensor.load_optimizer_1_recommended_program
                name: Recommended Program
              - entity: sensor.load_optimizer_1_recommended_start
                name: Recommended Start
              - entity: sensor.load_optimizer_1_estimated_scheduled_cost
                name: Estimated Cost
              - entity: sensor.load_optimizer_1_good_to_start
                name: Good To Start
          - type: markdown
            title: Automatic Run Readiness
            content: >-
              {% set overnight = 'sensor.load_optimizer_1_overnight_readiness' %}
              {% set negative = 'sensor.load_optimizer_1_negative_price_readiness' %}
              {% set icons = {'green': '🟢', 'amber': '🟠', 'red': '🔴'} %}
              {% set overnight_blockers = state_attr(overnight, 'blockers') or [] %}
              {% set overnight_warnings = state_attr(overnight, 'warnings') or [] %}
              {% set negative_blockers = state_attr(negative, 'blockers') or [] %}
              {% set negative_warnings = state_attr(negative, 'warnings') or [] %}

              ### {{ icons.get(states(overnight), '⚪') }} Overnight
              **{{ states(overnight) | upper }}** · {{ state_attr(overnight, 'program') or 'no program' }}

              {% if overnight_blockers %}**Blockers:** {{ overnight_blockers | join(', ') }}{% endif %}
              {% if overnight_warnings %}**Waiting:** {{ overnight_warnings | join(', ') }}{% endif %}

              ### {{ icons.get(states(negative), '⚪') }} Negative price
              **{{ states(negative) | upper }}** · {{ state_attr(negative, 'program') or 'no active opportunity' }}

              {% if negative_blockers %}**Blockers:** {{ negative_blockers | join(', ') }}{% endif %}
              {% if negative_warnings %}**Waiting:** {{ negative_warnings | join(', ') }}{% endif %}
      - type: grid
        cards:
          - type: entities
            title: Washing Machine 1
            entities:
              - entity: sensor.load_optimizer_2_status
                name: Optimizer Status
              - entity: sensor.load_optimizer_2_cycle_state
                name: Cycle State
              - entity: sensor.load_optimizer_2_power
                name: Current Power
              - entity: sensor.load_optimizer_2_sample_count
                name: Current Samples
              - entity: sensor.load_optimizer_2_total_runs
                name: Total Runs
          - type: entities
            title: Robo Vac 1
            entities:
              - entity: sensor.load_optimizer_3_status
                name: Optimizer Status
              - entity: sensor.load_optimizer_3_cycle_state
                name: Cycle State
              - entity: sensor.load_optimizer_3_power
                name: Current Power
              - entity: sensor.load_optimizer_3_sample_count
                name: Current Samples
              - entity: sensor.load_optimizer_3_total_runs
                name: Total Runs
  - title: Dishwasher
    path: dishwasher-1
    icon: mdi:dishwasher
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: 12
            header:
              show: true
              title: Dishwasher 1 - Cost Forecast
            graph_span: 15h
            span:
              start: hour
            apex_config:
              chart:
                height: 360
              stroke:
                curve: smooth
                width: 3
              markers:
                size: 3
              yaxis:
                title:
                  text: Estimated cost (£)
                labels:
                  formatter: |
                    EVAL:function(value) {
                      return Number(value).toFixed(2);
                    }
              xaxis:
                labels:
                  datetimeUTC: false
            series:
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Quick45
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Quick45" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Quick65
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Quick65" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Super60
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Super60" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Eco50
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Eco50" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Intensiv70
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Intensiv70" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: MachineCare
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "MachineCare" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: PreRinse
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "PreRinse" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: Auto2
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "Auto2" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
              - entity: sensor.load_optimizer_1_cost_forecast
                name: MixedLoad
                type: line
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast
                    .filter(row => row.program === "MixedLoad" && typeof row.cost_pence === "number")
                    .map(row => [new Date(row.start).getTime(), Math.round((row.cost_pence / 100) * 100) / 100]);
          - type: conditional
            grid_options:
              columns: 24
              rows: auto
            conditions:
              - entity: sensor.load_optimizer_1_program_catalogue
                state_not: "0"
            card:
              type: markdown
              title: Program Catalogue
              content: >
                {% set catalogue =
                (state_attr('sensor.load_optimizer_1_program_catalogue',
                'programs') or []) | sort(attribute='confidence', reverse=true)
                %} {% set capabilities =
                state_attr('sensor.load_optimizer_1_program_capabilities',
                'programs') or [] %}

                | Program | Runs | Runtime | Energy | Confidence | Class | Normal
                | Negative | Cooldown | Auto | Remote |

                |---|---:|---:|---:|---:|---|---:|---:|---:|---:|---|

                {%- for item in catalogue %}

                {%- set capability = (capabilities | selectattr('program',
                'eq', item.program) | list | first) or {} %}

                | {{ item.program }} | {{ item.runs }} | {{
                (item.expected_runtime_minutes | round(0, 'ceil') | int ~ ' min')
                if item.expected_runtime_minutes is number else 'unknown' }} |
                {{ (item.expected_energy_kwh | round(3) ~ ' kWh') if
                item.expected_energy_kwh is number else 'unknown' }} | {{
                item.confidence | round(0) }}% | {{ item.classification |
                default('unclassified') }} | {{ 'yes' if
                item.allow_normal_recommendation | default(false) else 'no' }}
                | {{ 'yes' if item.allow_negative_price_run | default(false)
                else 'no' }} | {{ item.minimum_hours_between_runs |
                default(0) }} h | {{ 'yes' if capability.can_auto_start |
                default(false) else 'no' }} | {{ capability.remote_start_status
                | default('unknown') }} |

                {%- endfor %}
      - type: grid
        cards:
          - type: entities
            title: Live State
            entities:
              - entity: sensor.load_optimizer_1_status
                name: Optimizer Status
              - entity: sensor.load_optimizer_1_cycle_state
                name: Cycle State
              - entity: sensor.load_optimizer_1_program
                name: Current Program
              - entity: sensor.load_optimizer_1_power
                name: Current Power
              - entity: sensor.load_optimizer_1_energy
                name: Energy Sensor
              - entity: sensor.load_optimizer_1_peak_power
                name: Peak Power
              - entity: sensor.load_optimizer_1_remote_activation_check
                name: Remote Activation Check
              - entity: sensor.load_optimizer_1_data_freshness
                name: Data Freshness
              - entity: sensor.load_optimizer_1_sample_count
                name: Current Samples
          - type: entities
            title: Scheduler Controls
            entities:
              - entity: input_button.load_optimizer_1_cancel_schedule
                name: Cancel Schedule
              - entity: input_datetime.load_optimizer_1_requested_start
                name: Requested Start
              - entity: input_datetime.load_optimizer_1_must_finish_by
                name: Must Finish By
              - entity: input_button.load_optimizer_1_clear_deadline
                name: Clear Travel Deadline
          - type: markdown
            title: Automatic Engine Traffic Lights
            content: >-
              {% set overnight = 'sensor.load_optimizer_1_overnight_readiness' %}
              {% set negative = 'sensor.load_optimizer_1_negative_price_readiness' %}
              {% set icons = {'green': '🟢', 'amber': '🟠', 'red': '🔴'} %}

              ## {{ icons.get(states(overnight), '⚪') }} Overnight — {{ states(overnight) | upper }}
              **Program:** {{ state_attr(overnight, 'program') or 'none' }}

              **Start:** {{ (state_attr(overnight, 'start') | as_datetime | as_local).strftime('%a %d %b %H:%M') if state_attr(overnight, 'start') else 'not scheduled' }}

              **Confidence:** {{ state_attr(overnight, 'confidence') or 0 }}% / {{ state_attr(overnight, 'confidence_threshold') or 20 }}% required

              **Blockers:** {{ (state_attr(overnight, 'blockers') or []) | join(', ') or 'none' }}

              **Waiting/warnings:** {{ (state_attr(overnight, 'warnings') or []) | join(', ') or 'none' }}

              ## {{ icons.get(states(negative), '⚪') }} Negative price — {{ states(negative) | upper }}
              **Program:** {{ state_attr(negative, 'program') or 'none' }}

              **Start:** {{ (state_attr(negative, 'start') | as_datetime | as_local).strftime('%a %d %b %H:%M') if state_attr(negative, 'start') else 'no active opportunity' }}

              **Confidence:** {{ state_attr(negative, 'confidence') or 0 }}% / {{ state_attr(negative, 'confidence_threshold') or 20 }}% required

              **Window runs:** {{ state_attr(negative, 'runs_in_window') or 0 }} / {{ state_attr(negative, 'maximum_runs_per_window') or 'unlimited' }}

              **Blockers:** {{ (state_attr(negative, 'blockers') or []) | join(', ') or 'none' }}

              **Waiting/warnings:** {{ (state_attr(negative, 'warnings') or []) | join(', ') or 'none' }}
          - type: markdown
            title: Scheduler / Queued Request
            content: >
              {% set result =
              states('sensor.load_optimizer_1_last_start_result') %} {% set
              execution = states('sensor.load_optimizer_1_execution_status') %}
              {% set message =
              states('input_text.load_optimizer_1_scheduler_message') %} {% set
              empty = ['unknown', 'unavailable', 'none', '', '—'] %}

              **Queued mode:** {{ states('input_select.load_optimizer_1_requested_mode') }}

              **Queued program:** {{ states('input_text.load_optimizer_1_requested_program') or 'none' }}

              **Queued start:** {{ states('input_datetime.load_optimizer_1_requested_start') or 'none' }}

              **Current overnight recommendation:** {{ state_attr('sensor.load_optimizer_1_overnight_recommendation', 'program') or 'none' }}

              {% if result == 'success' or message.startswith('Dishwasher
              started successfully') %} **Status:** OK {% elif message not in
              empty %} **Status:** {{ message }} {% elif execution not in empty
              %} **Status:** {{ execution }} {% else %} **Status:** Ready {%
              endif %}
      - type: grid
        cards:
          - type: entities
            title: Intent Recommendations
            entities:
              - entity: sensor.load_optimizer_1_now_recommendation
                name: Start Now
              - entity: sensor.load_optimizer_1_soon_recommendation
                name: Start Soon
              - entity: sensor.load_optimizer_1_overnight_recommendation
                name: Overnight
              - entity: sensor.load_optimizer_1_greenest_recommendation
                name: Greenest
              - entity: sensor.load_optimizer_1_negative_price_recommendation
                name: Negative Price
          - type: markdown
            title: Decision Comparison
            content: >
              {% set now_cost =
              state_attr('sensor.load_optimizer_1_now_recommendation',
              'cost_pence') %}

              {% set now_start =
              state_attr('sensor.load_optimizer_1_now_recommendation', 'start')
              %}

              {% set now_dt = now_start | as_datetime | as_local if now_start
              else none %}

              {% set soon_cost =
              state_attr('sensor.load_optimizer_1_soon_recommendation',
              'cost_pence') %}

              {% set soon_start =
              state_attr('sensor.load_optimizer_1_soon_recommendation', 'start')
              %}

              {% set soon_dt = soon_start | as_datetime | as_local if soon_start
              else none %}

              {% set night_cost =
              state_attr('sensor.load_optimizer_1_overnight_recommendation',
              'cost_pence') %}

              {% set night_start =
              state_attr('sensor.load_optimizer_1_overnight_recommendation',
              'start') %}

              {% set night_dt = night_start | as_datetime | as_local if
              night_start else none %}

              {% set green_cost =
              state_attr('sensor.load_optimizer_1_greenest_recommendation',
              'cost_pence') %}

              {% set green_start =
              state_attr('sensor.load_optimizer_1_greenest_recommendation',
              'start') %}

              {% set green_dt = green_start | as_datetime | as_local if
              green_start else none %}

              {% set neg_cost =
              state_attr('sensor.load_optimizer_1_negative_price_recommendation',
              'cost_pence') %}

              {% set neg_start =
              state_attr('sensor.load_optimizer_1_negative_price_recommendation',
              'start') %}

              {% set neg_dt = neg_start | as_datetime | as_local if neg_start
              else none %}

              | Option | Cost | Program | Start | Why |

              |---|---:|---|---|---|

              | Start now | {{ '£%.2f' | format((now_cost | float(0)) / 100) if
              now_cost is number else 'unknown' }} | {{
              state_attr('sensor.load_optimizer_1_now_recommendation',
              'program') or states('sensor.load_optimizer_1_now_recommendation')
              }} | {{ now_dt.strftime('%a %d %b %H:%M') if now_dt else 'unknown'
              }} | {{ state_attr('sensor.load_optimizer_1_now_recommendation',
              'reason') or 'none' }} |

              | Start soon | {{ '£%.2f' | format((soon_cost | float(0)) / 100)
              if soon_cost is number else 'unknown' }} | {{
              state_attr('sensor.load_optimizer_1_soon_recommendation',
              'program') or
              states('sensor.load_optimizer_1_soon_recommendation') }} | {{
              soon_dt.strftime('%a %d %b %H:%M') if soon_dt else 'unknown' }} |
              {{ state_attr('sensor.load_optimizer_1_soon_recommendation',
              'reason') or 'none' }} |

              | Overnight | {{ '£%.2f' | format((night_cost | float(0)) / 100)
              if night_cost is number else 'unknown' }} | {{
              state_attr('sensor.load_optimizer_1_overnight_recommendation',
              'program') or
              states('sensor.load_optimizer_1_overnight_recommendation') }} | {{
              night_dt.strftime('%a %d %b %H:%M') if night_dt else 'unknown' }}
              | {{
              state_attr('sensor.load_optimizer_1_overnight_recommendation',
              'reason') or 'none' }} |

              | Greenest | {{ '£%.2f' | format((green_cost | float(0)) / 100) if
              green_cost is number else 'unknown' }} | {{
              state_attr('sensor.load_optimizer_1_greenest_recommendation',
              'program') or
              states('sensor.load_optimizer_1_greenest_recommendation') }} | {{
              green_dt.strftime('%a %d %b %H:%M') if green_dt else 'unknown' }}
              | {{ state_attr('sensor.load_optimizer_1_greenest_recommendation',
              'reason') or 'none' }} |

              | Negative | {{ '£%.2f' | format((neg_cost | float(0)) / 100) if
              neg_cost is number else 'unknown' }} | {{
              state_attr('sensor.load_optimizer_1_negative_price_recommendation',
              'program') or
              states('sensor.load_optimizer_1_negative_price_recommendation') }}
              | {{ neg_dt.strftime('%a %d %b %H:%M') if neg_dt else 'unknown' }}
              | {{
              state_attr('sensor.load_optimizer_1_negative_price_recommendation',
              'reason') or 'none' }} |
          - type: entities
            title: Cost Recommendation
            entities:
              - entity: sensor.load_optimizer_1_cost_status
                name: Cost Status
              - entity: sensor.load_optimizer_1_recommended_program
                name: Recommended Program
              - entity: sensor.load_optimizer_1_cheapest_start
                name: Cheapest Start
              - entity: sensor.load_optimizer_1_cheapest_cost
                name: Cheapest Cost
              - entity: sensor.load_optimizer_1_cost_if_started_now
                name: Cost If Started Now
              - entity: sensor.load_optimizer_1_potential_saving
                name: Potential Saving
              - entity: sensor.load_optimizer_1_cost_confidence
                name: Cost Confidence
          - type: entities
            title: Green Window Context
            entities:
              - entity: sensor.load_optimizer_1_greenest_recommendation
                name: Greenest Recommendation
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: markdown
                    title: Start Now
                    content: >
                      {% set recommendation =
