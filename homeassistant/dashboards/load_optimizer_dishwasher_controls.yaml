# Raw Home Assistant dashboard cards for Dishwasher 1 request controls.
#
# This card stack uses the native controls bundled with the integration.

type: vertical-stack
cards:
  - type: entities
    title: Dishwasher 1 - Run Request
    show_header_toggle: false
    entities:
      - entity: sensor.load_optimizer_1_orchestration_status
        name: Native Schedule
      - entity: sensor.load_optimizer_1_execution_status
        name: Execution Status
      - entity: sensor.load_optimizer_1_orchestration_status
        name: Automation Package Status
      - entity: sensor.load_optimizer_1_last_start_result
        name: Last Start Result
      - entity: sensor.load_optimizer_1_last_start_program
        name: Last Start Program
      - entity: sensor.load_optimizer_1_last_start_failure_reason
        name: Last Failure Reason
      - entity: sensor.load_optimizer_1_last_start_reason_code
        name: Decision Reason Code
      - entity: sensor.load_optimizer_1_last_start_reason_detail
        name: Decision Explanation
      - entity: sensor.load_optimizer_1_last_start_decision_snapshot
        name: Decision Snapshot
      - entity: sensor.load_optimizer_1_last_start_attempt
        name: Last Start Attempt
      - entity: sensor.load_optimizer_1_remote_start_blocked_programs
        name: Remote Start Blocked Programs

  - type: horizontal-stack
    cards:
      - type: button
        entity: button.load_optimizer_1_request_now
        name: Start Now
        icon: mdi:play-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.load_optimizer_1_request_now

      - type: button
        entity: button.load_optimizer_1_request_soon
        name: Start Soon
        icon: mdi:clock-fast
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.load_optimizer_1_request_soon

      - type: button
        entity: button.load_optimizer_1_request_overnight
        name: Overnight
        icon: mdi:weather-night
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.load_optimizer_1_request_overnight

      - type: button
        entity: button.load_optimizer_1_cancel_schedule
        name: Cancel
        icon: mdi:cancel
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.load_optimizer_1_cancel_schedule

  - type: entities
    title: Manual Free / Special Price Window
    show_header_toggle: false
    entities:
      - entity: switch.load_optimizer_special_price_window_enabled
        name: Use This Window
      - entity: datetime.load_optimizer_special_price_window_start
        name: Starts
      - entity: datetime.load_optimizer_special_price_window_end
        name: Ends
      - entity: number.load_optimizer_special_price_window_price
        name: Price
      - entity: text.load_optimizer_special_price_window_label
        name: Label
      - entity: sensor.load_optimizer_special_price_window
        name: App Status
      - entity: switch.load_optimizer_1_auto_negative_price_enabled
        name: Auto-run Free / Negative Price

  - type: markdown
    title: Why This Program?
    content: |-
      {% set policy = state_attr('sensor.load_optimizer_1_cost_status', 'decision_policy') or {} -%}
      {% set selected = policy.get('selected_program', 'none') -%}
      {% set start = policy.get('selected_start') -%}
      {% set finish = policy.get('selected_finish') -%}
      {% set cost = policy.get('selected_cost_pence') -%}
      {% set factors = policy.get('selection_factors') or [] -%}
      | Metric | Value |
      |---|---:|
      | Selected program | {{ selected }} |
      | Selected cost | {% if cost is number %}£{{ (cost / 100) | round(2) }}{% else %}unknown{% endif %} |
      | Confidence | {{ policy.get('selected_confidence', 'unknown') }}% |
      | Preference rank | {{ policy.get('selected_preference_rank', 'unknown') }} |
      | Eligible programs | {{ policy.get('eligible_program_count', 0) }} |
      | Costed programs | {{ policy.get('costed_program_count', 0) }} |
      | Start | {% if start %}{{ as_timestamp(as_datetime(start)) | timestamp_custom('%a %H:%M', true) }}{% else %}unknown{% endif %} |
      | Finish | {% if finish %}{{ as_timestamp(as_datetime(finish)) | timestamp_custom('%a %H:%M', true) }}{% else %}unknown{% endif %} |
      | Why | {{ factors | join(', ') if factors else 'No decision factors published yet' }} |

  - type: markdown
    title: Alternative Programs
    content: |-
      {% set policy = state_attr('sensor.load_optimizer_1_cost_status', 'decision_policy') or {} -%}
      {% set alternatives = policy.get('alternative_programs') or [] -%}
      {% if alternatives | length == 0 -%}
      No alternative costed programs are currently available.
      {% else -%}
      | Program | Cost | Confidence | Start |
      |---|---:|---:|---:|
      {%- for item in alternatives %}
      | {{ item.program }} | {% if item.cost_pence is number %}£{{ (item.cost_pence / 100) | round(2) }}{% else %}unknown{% endif %} | {{ item.confidence | default('unknown') }}% | {% if item.start %}{{ as_timestamp(as_datetime(item.start)) | timestamp_custom('%a %H:%M', true) }}{% else %}unknown{% endif %} |
      {%- endfor %}
      {% endif -%}

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.load_optimizer_1_cost_status
        state_not: unavailable
    card:
      type: markdown
      title: Cooldown Rotation
      content: |-
        {% set policy = state_attr('sensor.load_optimizer_1_cost_status', 'decision_policy') or {} -%}
        {% set cooldowns = policy.get('cooldown_programs') or [] -%}
        {% if cooldowns | length == 0 -%}
        No programs are currently being rotated out by cooldown.
        {% else -%}
        | Program | Reason | Cooldown Until |
        |---|---|---:|
        {%- for item in cooldowns %}
        | {{ item.program }} | {{ item.reason }} | {% if item.cooldown_until %}{{ as_timestamp(as_datetime(item.cooldown_until)) | timestamp_custom('%a %H:%M', true) }}{% else %}unknown{% endif %} |
        {%- endfor %}
        {% endif -%}

  - type: markdown
    title: Excluded Programs
    content: |-
      {% set policy = state_attr('sensor.load_optimizer_1_cost_status', 'decision_policy') or {} -%}
      {% set excluded = policy.get('excluded_programs') or [] -%}
      {% if excluded | length == 0 -%}
      No configured programs are currently excluded.
      {% else -%}
      | Program | Reason | Confidence |
      |---|---|---:|
      {%- for item in excluded %}
      | {{ item.program }} | {{ item.reason }} | {{ item.confidence | default('unknown') }}% |
      {%- endfor %}
      {% endif -%}

  - type: entities
    title: Automation Reliability
    show_header_toggle: false
    entities:
      - entity: sensor.load_optimizer_restart_safety
        name: Restart Safety
      - entity: sensor.load_optimizer_1_orchestration_status
        name: Automation Package Status
      - entity: sensor.load_optimizer_1_execution_status
        name: Execution Status
      - entity: sensor.load_optimizer_1_last_start_result
        name: Last Start Result
      - entity: sensor.load_optimizer_1_last_start_program
        name: Last Start Program
      - entity: sensor.load_optimizer_1_last_start_failure_reason
        name: Last Failure Reason
      - entity: sensor.load_optimizer_1_last_start_attempt
        name: Last Start Attempt
      - entity: sensor.load_optimizer_1_remote_start_blocked_programs
        name: Blocked Programs

  - type: markdown
    title: Remote Start Diagnostics
    content: |-
      {% set attrs = state_attr('sensor.load_optimizer_1_execution_status', 'last_start_readiness') %}
      {% set blocked = state_attr('sensor.load_optimizer_1_remote_start_blocked_programs', 'blocked_programs') or [] %}
      | Check | Value |
      |---|---|
      | Mode | {{ state_attr('sensor.load_optimizer_1_execution_status', 'last_start_mode') or 'unknown' }} |
      | Requested program | {{ state_attr('sensor.load_optimizer_1_execution_status', 'last_start_program') or 'unknown' }} |
      | Bosch program key | {{ state_attr('sensor.load_optimizer_1_execution_status', 'last_start_program_key') or 'unknown' }} |
      | Bosch selected program | {{ state_attr('sensor.load_optimizer_1_execution_status', 'last_start_selected_program') or 'unknown' }} |
      | Operation state | {{ state_attr('sensor.load_optimizer_1_execution_status', 'last_start_operation_state') or 'unknown' }} |
      | Readiness | {{ attrs or 'unknown' }} |
      | Blocked programs | {{ blocked | join(', ') if blocked else 'none' }} |

  - type: markdown
    title: Program Automation Capabilities
    content: |-
      {% set programs = state_attr('sensor.load_optimizer_1_program_capabilities', 'programs') or [] %}
      {% if programs | length == 0 %}
      No program capability data has been published yet.
      {% else %}
      | Program | Auto | Normal | Negative | Remote |
      |---|---:|---:|---:|---|
      {% for item in programs %}
      | {{ item.program }} | {{ 'yes' if item.can_auto_start else 'no' }} | {{ 'yes' if item.can_recommend else 'no' }} | {{ 'yes' if item.can_negative_price else 'no' }} | {{ item.remote_start_status }} |
      {% endfor %}
      {% endif %}
