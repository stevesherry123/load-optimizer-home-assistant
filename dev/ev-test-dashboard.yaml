title: Charging Test Bench
views:
  - title: Test Bench
    path: charging-test
    icon: mdi:battery-charging
    cards:
      - type: markdown
        content: |-
          ## Charging Test Bench
          **Simulated battery. Real socket and tariff.**
          No battery reading here measures the laptop's actual charge.
      - type: entities
        title: Simulated Battery
        show_header_toggle: false
        entities:
          - entity: input_number.ev_trial_battery_percent
            name: Battery charge
          - entity: input_number.ev_trial_capacity_kwh
            name: Capacity
          - entity: input_number.ev_trial_target_percent
            name: Target
          - entity: input_boolean.ev_trial_connected
            name: Connected
          - entity: input_boolean.ev_trial_simulate_battery_gain
            name: Simulate battery gain from meter
          - entity: input_datetime.ev_trial_simulation_expires
            name: Simulation expires
          - entity: sensor.ev_trial_battery_simulation_status
            name: Battery simulation status
      - type: entities
        title: Load And Control
        show_header_toggle: false
        entities:
          - entity: switch.ev_trial_load
            name: Test socket
          - entity: sensor.ev_trial_load_power
            name: Actual power
          - entity: sensor.ev_trial_load_energy
            name: Supply meter
          - entity: sensor.ev_trial_charging_status
            name: Inferred charging
          - entity: switch.ev_trial_automatic_charging_control
            name: Automatic control
